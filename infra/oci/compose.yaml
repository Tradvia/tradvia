# Tradvia services on the OCI host. Only Caddy is published to the internet.
# Secrets come from /opt/tradvia/.env (chmod 600, never committed).

name: tradvia

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRADVIA_DOMAIN: ${TRADVIA_DOMAIN:?set TRADVIA_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dashboard:/srv/dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  api:
    build:
      context: ./src
      dockerfile: infra/oci/Dockerfile.api
    restart: unless-stopped
    # Each orchestrator chat turn (#104) shells out to `claude -p` as a child process
    # alongside uvicorn; 256m was sized for the API alone and starved that subprocess.
    mem_limit: 512m
    environment:
      TRADVIA_REPO: ${TRADVIA_REPO:-Tradvia/tradvia}
      TRADVIA_PROJECTS: ${TRADVIA_PROJECTS:-${TRADVIA_REPO:-Tradvia/tradvia}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATABASE_URL: postgresql://tradvia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tradvia
      TRADVIA_WEBHOOK_SECRET: ${TRADVIA_WEBHOOK_SECRET:-}
      # Sign in with GitHub (docs/github-app.md). Off unless all three are set.
      TRADVIA_DOMAIN: ${TRADVIA_DOMAIN:?set TRADVIA_DOMAIN in .env}
      TRADVIA_GITHUB_APP_CLIENT_ID: ${TRADVIA_GITHUB_APP_CLIENT_ID:-}
      TRADVIA_GITHUB_APP_CLIENT_SECRET: ${TRADVIA_GITHUB_APP_CLIENT_SECRET:-}
      TRADVIA_SECRET_KEY: ${TRADVIA_SECRET_KEY:-}
      # Orchestrator chat (#57/#104): without this, every chat message fails with
      # "The orchestrator stopped: Claude Code CLI not found" (claude_code.run_claude()),
      # or, once the CLI is on PATH, with the CLI's own not-authenticated error.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20, -c, work_mem=2MB]
    environment:
      POSTGRES_DB: tradvia
      POSTGRES_USER: tradvia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradvia -d tradvia"]
      interval: 10s
      retries: 5

networks:
  edge: {}
  internal:
    internal: true   # no route to the internet, not reachable from outside

volumes:
  caddy_data: {}
  caddy_config: {}
  pg_data: {}
