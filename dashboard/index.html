<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradvia · Runs</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d37; --text: #e6e9ee;
    --muted: #8b95a3; --ok: #3fb68b; --bad: #e5605a; --warn: #d9a441; --info: #5b9bf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--info); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header, main { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  .auth { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .auth img { width: 22px; height: 22px; border-radius: 50%; }
  .auth a.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px;
  }
  .auth a.btn:hover { border-color: var(--muted); text-decoration: none; }
  button:disabled { opacity: .5; cursor: default; }
  #bell.has { border-color: var(--warn); }
  #bell.has #bell-count { color: var(--warn); font-weight: 600; }
  .inbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 12px; margin-bottom: 14px; }
  .inbox[hidden], .notify[hidden] { display: none; }
  .inbox h3 { margin: 10px 0 4px; font-size: 13px; }
  .inbox ul { list-style: none; margin: 0; padding: 0; }
  .inbox li { padding: 3px 0; overflow-wrap: anywhere; }
  .notify { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; font-size: 13px; }
  .notify label { display: flex; gap: 6px; align-items: center; }
  .msg { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); }
  .msg.error { border-color: var(--bad); color: var(--text); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .kpi .v { font-size: 22px; font-weight: 600; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; }
  .filters label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  .filters input[type=date] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; padding: 2px 6px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .chart svg { width: 100%; height: 90px; display: block; }
  .chart rect { fill: var(--info); }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .board.with-backlog { grid-template-columns: repeat(7, minmax(180px, 1fr)); }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
  .badge.pronto, .badge.concluido { color: var(--ok); }
  .badge.bloqueado { color: var(--bad); }
  .badge.andamento { color: var(--info); }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 80px; }
  .col h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 6px; overflow-wrap: anywhere; cursor: pointer; }
  .card:focus-visible { outline: 2px solid var(--info); }
  .card .cost { color: var(--muted); font-size: 12px; }
  .activity { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; cursor: default; font-size: 12px; }
  .activity h4 { margin: 0 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .acts button, .approval button, .newcard button { padding: 2px 8px; font-size: 12px; }
  .newcard { display: grid; gap: 4px; margin-bottom: 8px; }
  .newcard[hidden] { display: none; }
  .newcard input, .newcard textarea, .approval textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; width: 100%; box-sizing: border-box;
  }
  .approval { margin-top: 8px; cursor: default; font-size: 12px; display: grid; gap: 4px; }
  .approval h4 { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .approval pre.plan { white-space: pre-wrap; margin: 0; max-height: 220px; overflow: auto; }
  .action-error { padding: 4px 8px; font-size: 12px; }
  .pull { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; cursor: default; font-size: 12px; display: grid; gap: 4px; }
  .pull h4, .deploys h4 { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pull pre { white-space: pre-wrap; margin: 0; max-height: 260px; overflow: auto; background: var(--bg); padding: 4px 6px; border-radius: 6px; }
  .pull ul, .deploys ul { list-style: none; margin: 0; padding: 0; }
  .pull li, .deploys li { padding: 3px 0; overflow-wrap: anywhere; }
  .pull button.file { border: 0; background: none; padding: 0; color: var(--info); text-align: left; font-size: 12px; }
  .pull button, .deploys button, .deploys input[type=text] { padding: 2px 8px; font-size: 12px; }
  .deploys input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; }
  .deploys { display: grid; gap: 6px; }
  .deploys .op { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .activity ul, .recent ul { list-style: none; margin: 0; padding: 0; }
  .activity li, .recent li { padding: 3px 0; }
  .when { color: var(--muted); }
  .activity ol { margin: 4px 0 0 18px; padding: 0; }
  .card .n { color: var(--muted); font-size: 12px; }
  .col.AGENT_WORKING h3 { color: var(--info); }
  .col.WAITING_HUMAN h3 { color: var(--warn); }
  .col.BLOCKED h3 { color: var(--bad); }
  .col.IN_REVIEW_PR h3 { color: var(--info); }
  .col.DONE h3 { color: var(--ok); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.title { white-space: normal; min-width: 180px; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .run { color: var(--info); } .neutral { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Tradvia · <span data-i18n="title"></span></h1>
    <div class="sub" id="meta"></div>
  </div>
  <div class="controls">
    <button id="bell" type="button" hidden><span aria-hidden="true">🔔</span> <span id="bell-count">0</span></button>
    <span id="auth" class="auth" hidden></span>
    <select id="project" aria-label="Project" hidden></select>
    <select id="lang" aria-label="Language">
      <option value="pt">PT-BR</option>
      <option value="en">EN</option>
    </select>
    <label class="sub auto"><input type="checkbox" id="auto-refresh" checked> <span data-i18n="autoRefresh"></span></label>
    <button id="refresh" data-i18n="refresh"></button>
  </div>
</header>
<main>
  <section id="inbox" class="inbox" hidden>
    <h2 data-i18n="inbox"></h2>
    <div id="inbox-list"></div>
    <div id="notify" class="notify" hidden></div>
  </section>
  <div id="status" class="msg" hidden></div>
  <div id="content" hidden>
    <h2 data-i18n="recent"></h2>
    <div class="recent" id="recent"></div>
    <h2 data-i18n="kpis"></h2>
    <div class="filters" id="filters"></div>
    <div class="kpis" id="kpis"></div>
    <div class="charts" id="charts"></div>
    <div class="note" data-i18n="costNote"></div>
    <h2 data-i18n="board"></h2>
    <div class="board" id="board"></div>
    <div id="deploys-section" hidden>
      <h2 data-i18n="deploys"></h2>
      <div class="deploys" id="deploys"></div>
    </div>
    <h2 data-i18n="runs"></h2>
    <label class="sub"><input type="checkbox" id="show-skipped"> <span data-i18n="showSkipped"></span></label>
    <div id="runs"></div>
  </div>
</main>

<script>
"use strict";

/* ---------- Pure logic (no DOM) ---------- */

const STATES = ["BACKLOG", "AGENT_WORKING", "WAITING_HUMAN", "BLOCKED", "IN_REVIEW_PR", "DONE"];
// Run conclusions that mean the run ended without producing anything for a
// human to act on (no plan posted, no PR opened): the card is stuck, not
// waiting for a decision.
const FAILED_CONCLUSIONS = ["failure", "timed_out", "cancelled", "action_required", "startup_failure"];
const EXECUTORS = { "agent.yml": "Tradvia agent", "claude.yml": "Claude Code" };

function isAgentBranch(ref) {
  return typeof ref === "string" && (ref.startsWith("tradvia/") || ref.startsWith("claude/"));
}

function branchMatchesIssue(ref, n) {
  if (typeof ref !== "string") return false;
  return ref === "tradvia/issue-" + n || ref.startsWith("claude/issue-" + n + "-");
}

// agentRuns: runs of agent.yml only.
function deriveCardState(issue, prs, agentRuns) {
  if (issue.state === "closed") return "DONE";
  const hasOpenPr = prs.some(
    (p) => p.state === "open" && branchMatchesIssue(p.head && p.head.ref, issue.number)
  );
  if (hasOpenPr) return "IN_REVIEW_PR";
  const mine = agentRuns.filter((r) => (r.display_title || r.name) === issue.title);
  if (mine.some((r) => r.status !== "completed")) return "AGENT_WORKING";
  // agentRuns keeps GitHub's own newest-first order, so the first completed
  // run found here is the most recent one for this card.
  const latest = mine.find((r) => r.status === "completed");
  if (latest) return FAILED_CONCLUSIONS.includes(latest.conclusion) ? "BLOCKED" : "WAITING_HUMAN";
  return "BACKLOG";
}

// Duration in ms, or null when timestamps are missing.
function runDuration(run) {
  const a = Date.parse(run.run_started_at), b = Date.parse(run.updated_at);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.max(0, b - a);
}

function median(values) {
  const v = values.filter((x) => typeof x === "number" && !isNaN(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

// Completed runs that count for metrics: skipped and cancelled are ignored.
function isMeasurable(r) {
  return r.status === "completed" && r.conclusion !== "skipped" && r.conclusion !== "cancelled";
}

// Success rate over measurable runs, or null when there are none.
function successRate(runs) {
  const done = runs.filter(isMeasurable);
  if (!done.length) return null;
  return done.filter((r) => r.conclusion === "success").length / done.length;
}

function agentPrStats(prs) {
  const merged = prs.filter((p) => p.merged_at && isAgentBranch(p.head && p.head.ref));
  const times = merged.map((p) => Date.parse(p.merged_at) - Date.parse(p.created_at));
  return { merged: merged.length, medianMs: median(times) };
}

function computeKpis(runs, prs) {
  const pr = agentPrStats(prs);
  return {
    successRate: successRate(runs),
    medianDurationMs: median(runs.filter(isMeasurable).map(runDuration)),
    mergedPrs: pr.merged,
    medianPrMs: pr.medianMs,
  };
}

function formatDuration(ms) {
  if (ms == null) return "—";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + (m % 60) + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}

function visibleRuns(runs, showSkipped) {
  return showSkipped ? runs : runs.filter((r) => r.conclusion !== "skipped");
}

function tagRuns(workflowFile, payload) {
  return ((payload && payload.workflow_runs) || []).map((r) => ({ ...r, workflowFile }));
}

/* ----- Activity timeline and cost (pure) ----- */

// Extracts the estimated cost from a PR/comment body: {usd, seconds, label} or null.
function parseCost(body) {
  if (typeof body !== "string") return null;
  const num = "(\\d+(?:\\.\\d+)?)";
  const secs = "(?:\\s*[·•|-]\\s*" + num + "\\s*s\\b)?";
  const patterns = [
    new RegExp("estimated cost \\(api-equivalent\\):\\s*\\$" + num + secs, "i"),
    new RegExp("\\bcost:\\s*\\$" + num + secs, "i"),
    new RegExp("cost so far[^$\\n]*\\$" + num, "i"),
  ];
  for (const re of patterns) {
    const m = re.exec(body);
    if (!m) continue;
    const usd = parseFloat(m[1]);
    const seconds = m[2] != null ? parseFloat(m[2]) : null;
    return { usd, seconds, label: "$" + usd.toFixed(4) + (seconds != null ? " · " + Math.round(seconds) + "s" : "") };
  }
  return null;
}

// Cost of a PR: the store sends it parsed (`tradvia_cost`, it keeps no PR body);
// GitHub and the proxy send the body, parsed here.
function prCost(p) {
  const c = p && p.tradvia_cost;
  if (c && typeof c.usd === "number") {
    const seconds = typeof c.seconds === "number" ? c.seconds : null;
    return { usd: c.usd, seconds, label: "$" + c.usd.toFixed(4) + (seconds != null ? " · " + Math.round(seconds) + "s" : "") };
  }
  return parseCost(p && p.body);
}

// Only https links to github.com are rendered as links.
function safeGithubUrl(u) {
  try {
    const p = new URL(u);
    return p.protocol === "https:" && (p.hostname === "github.com" || p.hostname === "www.github.com") ? p.href : null;
  } catch (e) { return null; }
}

function isBotUser(u) {
  return !!u && (u.type === "Bot" || (typeof u.login === "string" && u.login.endsWith("[bot]")));
}

// Plan posted by ask_human (graph.py): contains "❓" and "Responda **Aprovado**, ...".
function isPlanComment(body) {
  return typeof body === "string" && (body.includes("❓") || /Responda\s+\**Aprovado/i.test(body));
}

function parsePlan(body) {
  const lines = String(body).split("\n").map((l) => l.trim()).filter(Boolean);
  const steps = lines.filter((l) => /^\d+\.\s/.test(l));
  const summary = lines.slice(1).filter((l) =>
    !/^\d+\.\s/.test(l) && !l.includes("❓") && !/^Responda/i.test(l) && !/^Arquivo:/i.test(l) &&
    !/^Estimated cost/i.test(l) && !/^Tokens:/i.test(l)).join(" ");
  return { summary, steps };
}

function firstLine(body) {
  const l = String(body || "").split("\n").map((x) => x.replace(/[*_`#>]/g, "").trim()).find(Boolean) || "";
  return l.length > 160 ? l.slice(0, 157) + "…" : l;
}

// Rejection notice posted by the agent (no fixed text in graph.py, so matched by keyword).
function isRejectionComment(body) {
  return typeof body === "string" && /rejeitad|rejected/i.test(body);
}

// Classifies one GitHub timeline event. ctx = {planSeen: bool}.
// Human replies after a plan come back as "noEffect"; buildTimeline sets the final
// effect from the next agent action.
// Returns {kind, actor, textKey, url, time, detail} or null.
function classifyTimelineEvent(ev, ctx) {
  if (!ev || typeof ev !== "object") return null;
  const c = ctx || {};
  const time = ev.created_at || ev.submitted_at || null;
  const url = safeGithubUrl(ev.html_url);
  const mk = (kind, actor, textKey, detail) => ({ kind, actor, textKey, url, time, detail: detail || null });
  if (ev.event === "labeled") {
    if (!ev.label || ev.label.name !== "agent:ready") return null;
    return mk("started", ev.actor && ev.actor.login, "started");
  }
  if (ev.event === "closed" || ev.event === "merged") {
    return mk("done", ev.actor && ev.actor.login, "done");
  }
  if (ev.event !== "commented") return null;
  const login = ev.user && ev.user.login;
  const body = ev.body || "";
  if (login === "github-actions[bot]") {
    if (isPlanComment(body)) return mk("plan", "Agent-Architect", "planPosted", parsePlan(body));
    if (c.planSeen && isRejectionComment(body)) return mk("rejection", "Agent-Architect", null);
    if (/PR aberto|Pull request opened/i.test(body)) {
      const m = /\/pull\/(\d+)/.exec(body);
      return mk("pr", "Agent-Coder", "openedPr", { number: m ? m[1] : null });
    }
    return null;
  }
  if (login === "claude[bot]") return mk("claude", "claude[bot]", "claudeCode", { status: firstLine(body) });
  if (!isBotUser(ev.user) && c.planSeen) {
    return mk("reply", login, "noEffect", c.prSeen ? { afterPr: true } : null);
  }
  return null;
}

// Sorts events by time and classifies them. After each plan, the last human reply before
// the next agent action is the one that counts, and that action defines its effect:
// PR opened -> approved, new plan -> adjustment, rejection message -> rejected.
// Other replies stay "noEffect"; with no agent action yet, the last one is "awaiting".
function buildTimeline(events) {
  const sorted = (Array.isArray(events) ? events : [])
    .filter((e) => e && (e.created_at || e.submitted_at))
    .sort((a, b) => Date.parse(a.created_at || a.submitted_at) - Date.parse(b.created_at || b.submitted_at));
  const ctx = { planSeen: false, prSeen: false };
  const out = [];
  let pending = []; // human replies since the last plan, in order
  const settle = (textKey) => {
    if (pending.length) pending[pending.length - 1].textKey = textKey;
    pending = [];
  };
  for (const ev of sorted) {
    const item = classifyTimelineEvent(ev, ctx);
    if (!item) continue;
    if (item.kind === "reply") { if (!(item.detail && item.detail.afterPr)) pending.push(item); }
    else if (item.kind === "pr") { settle("approved"); ctx.prSeen = true; }
    else if (item.kind === "plan") { settle("adjust"); ctx.planSeen = true; ctx.prSeen = false; }
    else if (item.kind === "rejection") { settle("rejected"); continue; }
    out.push(item);
  }
  settle("awaiting");
  return out;
}

// cards: [{number, title, items}]; returns the newest `limit` events across cards.
function recentActivity(cards, limit = 10) {
  const all = [];
  for (const c of cards) {
    for (const it of c.items) all.push({ ...it, cardNumber: c.number, cardTitle: c.title });
  }
  return all.sort((a, b) => Date.parse(b.time) - Date.parse(a.time)).slice(0, limit);
}

// Cost of the agent PR that belongs to an issue (newest PR with a parsable cost).
function costForIssue(issue, prs) {
  const mine = prs
    .filter((p) => branchMatchesIssue(p.head && p.head.ref, issue.number))
    .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
  for (const p of mine) {
    const c = prCost(p);
    if (c) return c;
  }
  return null;
}

// Total and median cost over agent PRs with a parsable cost: {total, median, count}.
function totalAndMedianCost(prs) {
  const costs = prs
    .filter((p) => isAgentBranch(p.head && p.head.ref))
    .map((p) => prCost(p))
    .filter(Boolean)
    .map((c) => c.usd);
  return { total: costs.reduce((a, b) => a + b, 0), median: median(costs), count: costs.length };
}

/* ----- KPI filters, card cost and tokens (pure) ----- */

const DAY_MS = 86400000;
const PRESET_DAYS = { "7d": 7, "30d": 30, "90d": 90 };
const FILTER_KEYS = ["from", "to", "executor", "card", "status"];
const EXECUTOR_BRANCH = { agent: "tradvia/", claude: "claude/" };
const EXECUTOR_WORKFLOW = { agent: "agent.yml", claude: "claude.yml" };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

// Mirror of parse_tokens() in core/src/tradvia/events.py: "Tokens: 12 345 in · 3 210 out · 80 000 cache".
// Thousands may be grouped by space, NBSP, dot or comma, or not grouped at all.
function parseTokens(body) {
  if (typeof body !== "string") return null;
  const int = "(\\d{1,3}(?:[ \\u00a0\\u202f.,]\\d{3})+|\\d+)";
  const sep = "\\s*[·•|-]\\s*";
  const m = new RegExp("\\btokens:\\s*" + int + "\\s*in" + sep + int + "\\s*out(?:" + sep + int + "\\s*cache)?", "i").exec(body);
  if (!m) return null;
  const n = (s) => (s ? parseInt(s.replace(/\D/g, ""), 10) : 0);
  return { in: n(m[1]), out: n(m[2]), cache: n(m[3]) };
}

// Same line the agent writes: space as thousands separator.
function formatTokens(n) {
  return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

// Filters from the query string. `from` is 7d | 30d | 90d | YYYY-MM-DD (null = everything).
function parseFilters(search) {
  const q = new URLSearchParams(search || "");
  const from = q.get("from"), to = q.get("to"), executor = q.get("executor"), status = q.get("status");
  const card = parseInt(q.get("card"), 10);
  return {
    from: from && (PRESET_DAYS[from] || DATE_RE.test(from)) ? from : null,
    to: to && DATE_RE.test(to) ? to : null,
    executor: executor === "agent" || executor === "claude" ? executor : "all",
    card: card > 0 ? card : null,
    status: STATES.includes(status) ? status : "all",
  };
}

// Query string for the filters, keeping every other parameter of `base` (such as ?repo=).
function filtersToSearch(filters, base) {
  const q = new URLSearchParams(base || "");
  FILTER_KEYS.forEach((k) => q.delete(k));
  const f = filters || {};
  if (f.from) q.set("from", f.from);
  if (f.to) q.set("to", f.to);
  if (f.executor && f.executor !== "all") q.set("executor", f.executor);
  if (f.card) q.set("card", String(f.card));
  if (f.status && f.status !== "all") q.set("status", f.status);
  const s = q.toString();
  return s ? "?" + s : "";
}

// Period as [start, end) in ms (UTC); null side = unbounded. `to` includes its whole day.
function periodBounds(filters, now) {
  const f = filters || {};
  let start = null, end = null;
  if (f.from && PRESET_DAYS[f.from]) start = now - PRESET_DAYS[f.from] * DAY_MS;
  else if (f.from) start = Date.parse(f.from + "T00:00:00Z");
  if (f.to) end = Date.parse(f.to + "T00:00:00Z") + DAY_MS;
  return { start: isNaN(start) ? null : start, end: isNaN(end) ? null : end };
}

function inPeriod(iso, bounds) {
  if (bounds.start == null && bounds.end == null) return true;
  const t = Date.parse(iso);
  if (isNaN(t)) return false;
  return (bounds.start == null || t >= bounds.start) && (bounds.end == null || t < bounds.end);
}

function branchExecutor(ref) {
  if (typeof ref !== "string") return null;
  return ref.startsWith("tradvia/") ? "agent" : ref.startsWith("claude/") ? "claude" : null;
}

function issueOfBranch(ref) {
  const m = /^(?:tradvia\/issue-|claude\/issue-)(\d+)/.exec(typeof ref === "string" ? ref : "");
  return m ? parseInt(m[1], 10) : null;
}

// The card a run belongs to: agent runs carry the issue title, Claude Code runs "#N" in the title.
function runIssue(run, issues) {
  const title = run.display_title || run.name || "";
  return issues.find((i) => i.title === title) ||
    issues.find((i) => new RegExp("#" + i.number + "(?!\\d)").test(title)) || null;
}

// Narrows cards, PRs and runs to the filters. `now` is the reference for 7d/30d/90d.
// Cards count by creation date, PRs by creation date, runs by start time.
function applyFilters(data, filters, now) {
  const f = filters || {};
  const bounds = periodBounds(f, now);
  const allIssues = data.issues || [], allPrs = data.prs || [], allRuns = data.runs || [];
  const agentRuns = data.agentRuns || [];
  const executorOf = (issue) => {
    const ex = new Set();
    allPrs.forEach((p) => { if (branchMatchesIssue(p.head && p.head.ref, issue.number)) ex.add(branchExecutor(p.head.ref)); });
    allRuns.forEach((r) => { if (runIssue(r, [issue])) ex.add(r.workflowFile === "claude.yml" ? "claude" : "agent"); });
    return ex;
  };
  const cardOk = (i) =>
    (!f.card || i.number === f.card) &&
    (!f.status || f.status === "all" || deriveCardState(i, allPrs, agentRuns) === f.status) &&
    (!f.executor || f.executor === "all" || executorOf(i).has(f.executor));
  const okCards = allIssues.filter(cardOk);
  const okNumbers = new Set(okCards.map((i) => i.number));
  const cardFiltered = (f.card || (f.status && f.status !== "all"));
  const issues = okCards.filter((i) => inPeriod(i.created_at, bounds));
  const prs = allPrs.filter((p) => {
    const ref = p.head && p.head.ref;
    if (f.executor && f.executor !== "all" && branchExecutor(ref) !== f.executor) return false;
    if (cardFiltered && !okNumbers.has(issueOfBranch(ref))) return false;
    return inPeriod(p.created_at, bounds);
  });
  const runs = allRuns.filter((r) => {
    if (f.executor && f.executor !== "all" && r.workflowFile !== EXECUTOR_WORKFLOW[f.executor]) return false;
    if (cardFiltered) {
      const i = runIssue(r, allIssues);
      if (!i || !okNumbers.has(i.number)) return false;
    }
    return inPeriod(r.run_started_at || r.created_at, bounds);
  });
  return { issues, prs, runs, agentRuns: agentRuns.filter((r) => runs.includes(r)) };
}

// Plan costs of a card from its comments: stored records ({usd, tokens_in, ...} from the store)
// or GitHub comments (plan comments of the agent, parsed from the body).
function planCostsOf(comments) {
  const out = [];
  for (const c of Array.isArray(comments) ? comments : []) {
    if (c && typeof c.usd === "number") {
      out.push({ usd: c.usd, in: c.tokens_in || 0, out: c.tokens_out || 0, cache: c.tokens_cache || 0, at: c.created_at || null });
      continue;
    }
    const body = c && c.body;
    if (!isPlanComment(body) || !(c.user && c.user.login === "github-actions[bot]")) continue;
    const cost = parseCost(body);
    if (!cost) continue;
    const tk = parseTokens(body) || { in: 0, out: 0, cache: 0 };
    out.push({ usd: cost.usd, in: tk.in, out: tk.out, cache: tk.cache, at: c.created_at || null });
  }
  return out;
}

function parseSoFar(body) {
  const m = typeof body === "string" ? /cost so far[^$\n]*\$(\d+(?:\.\d+)?)/i.exec(body) : null;
  return m ? parseFloat(m[1]) : null;
}

// Cost parts of a card: every plan plus the executor of its newest costed PR. The PR's
// "estimated cost so far" already includes the plans, so it only stands in (`fallback`) when
// no plan comment was stored. The executor line is the one with seconds ("$1.0051 · 285s").
// Returns {plans, exec, fallback} (each entry {usd, in, out, cache, at}) or null without any cost.
function cardCostParts(issue, comments, prs) {
  const plans = planCostsOf(comments);
  const mine = prs
    .filter((p) => branchMatchesIssue(p.head && p.head.ref, issue.number))
    .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
  let exec = null, fallback = null;
  for (const p of mine) {
    const c = prCost(p);
    if (!c) continue;
    const tc = p.tradvia_cost || {};
    const tk = typeof tc.tokens_in === "number" && (tc.tokens_in || tc.tokens_out || tc.tokens_cache)
      ? { in: tc.tokens_in, out: tc.tokens_out || 0, cache: tc.tokens_cache || 0 }
      : parseTokens(p.body) || { in: 0, out: 0, cache: 0 };
    const part = { usd: c.usd, in: tk.in, out: tk.out, cache: tk.cache, at: p.created_at || null };
    if (c.seconds != null) exec = part; else fallback = part;
    // "Cost so far" (planning + execution) for cards whose plans carry no cost line.
    const soFar = typeof tc.so_far_usd === "number" ? tc.so_far_usd : parseSoFar(p.body);
    if (soFar != null) fallback = { ...part, usd: soFar };
    break;
  }
  if (!plans.length && !exec && !fallback) return null;
  // Without stored plans the "so far" total already covers the execution: use it alone.
  if (!plans.length && fallback) return { plans, exec: null, fallback };
  return { plans, exec, fallback: null };
}

// Total cost and tokens of a card, or null when nothing was recorded.
function cardCosts(issue, comments, prs) {
  const parts = cardCostParts(issue, comments, prs);
  if (!parts) return null;
  const all = parts.plans.concat(parts.exec || [], parts.fallback || []);
  const sum = (k) => all.reduce((a, p) => a + p[k], 0);
  return { usd: sum("usd"), in: sum("in"), out: sum("out"), cache: sum("cache"), plans: parts.plans.length };
}

// Indicators over an already filtered view: {cards, withCost, totalUsd, medianUsd, tokens, medianTokens,
// perMergedPrUsd, mergedPrs}. Cost and token fields are null when the period has no data.
function filteredCostKpis(view) {
  const prs = view.prs;
  const rows = view.issues.map((i) => cardCosts(i, i.tradvia_plan_cost, prs)).filter(Boolean);
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const merged = view.prs.filter((p) => p.merged_at && isAgentBranch(p.head && p.head.ref));
  const mergedCosts = merged.map((p) => {
    const issue = view.issues.find((i) => i.number === issueOfBranch(p.head.ref));
    return issue ? cardCosts(issue, issue.tradvia_plan_cost, prs) : null;
  }).filter(Boolean);
  return {
    cards: view.issues.length,
    withCost: rows.length,
    totalUsd: rows.length ? sum("usd") : null,
    medianUsd: median(rows.map((r) => r.usd)),
    tokens: rows.length ? { in: sum("in"), out: sum("out"), cache: sum("cache") } : null,
    medianTokens: median(rows.map((r) => r.in + r.out + r.cache)),
    mergedPrs: merged.length,
    perMergedPrUsd: mergedCosts.length ? mergedCosts.reduce((a, c) => a + c.usd, 0) / mergedCosts.length : null,
  };
}

// Cost and tokens per day (UTC): plans by comment time, executor by PR creation time.
// Returns [{day: "YYYY-MM-DD", usd, tokens}] for each day of the period (up to `maxDays`).
function dailySeries(view, filters, now, maxDays) {
  const days = new Map();
  const add = (at, part) => {
    const t = Date.parse(at);
    if (isNaN(t) || !part) return;
    const day = new Date(t).toISOString().slice(0, 10);
    const d = days.get(day) || { day, usd: 0, tokens: 0 };
    d.usd += part.usd; d.tokens += part.in + part.out + part.cache;
    days.set(day, d);
  };
  for (const issue of view.issues) {
    const parts = cardCostParts(issue, issue.tradvia_plan_cost, view.prs);
    if (!parts) continue;
    parts.plans.forEach((p) => add(p.at, p));
    [parts.exec, parts.fallback].forEach((p) => p && add(p.at, p));
  }
  const bounds = periodBounds(filters, now);
  const keys = [...days.keys()].sort();
  const startMs = bounds.start != null ? bounds.start : keys.length ? Date.parse(keys[0] + "T00:00:00Z") : now;
  const endMs = bounds.end != null ? Math.min(bounds.end - 1, now) : now;
  const limit = maxDays || 90;
  const out = [];
  for (let t = Math.max(startMs, endMs - (limit - 1) * DAY_MS); t <= endMs; t += DAY_MS) {
    const day = new Date(t).toISOString().slice(0, 10);
    out.push(days.get(day) || { day, usd: 0, tokens: 0 });
  }
  return out;
}

// Geometry of a bar chart: [{x, y, w, h, day, value}] inside width x height (no DOM).
function barChartModel(series, key, width, height) {
  const max = Math.max(0, ...series.map((s) => s[key]));
  const slot = series.length ? width / series.length : width;
  const w = Math.max(1, slot * 0.8);
  return series.map((s, i) => {
    const h = max > 0 ? (s[key] / max) * height : 0;
    return { x: i * slot + (slot - w) / 2, y: height - h, w, h, day: s.day, value: s[key] };
  });
}

// Up to `max` cards for recent activity: open first, then most recently closed.
function pickCardsForRecent(issues, max = 5) {
  const ts = (i) => Date.parse(i.state === "closed" ? i.closed_at || i.updated_at : i.updated_at) || 0;
  const open = issues.filter((i) => i.state !== "closed").sort((a, b) => ts(b) - ts(a));
  const closed = issues.filter((i) => i.state === "closed").sort((a, b) => ts(b) - ts(a));
  return open.concat(closed).slice(0, max);
}

/* ---------- Data layer ---------- */

class RateLimitError extends Error {}

async function getJson(url) {
  const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
  if (res.status === 403 || res.status === 429) throw new RateLimitError(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function getRepo() {
  const q = new URLSearchParams(location.search).get("repo");
  return q && /^[\w.-]+\/[\w.-]+$/.test(q) ? q : "Tradvia/tradvia";
}

// Same-origin read-only proxy on app.tradvia.org; GitHub direct elsewhere.
let GH_API = "https://api.github.com";
// Postgres-backed read API; set only when /api/store/health reports data.
let STORE_API = null;
let dataSource = "GitHub";
let storeHealth = null;

// The store is used for a project only when it already holds issues for it.
function selectStore(repo) {
  const h = storeHealth;
  let hasData = false;
  if (h && h.ok === true) {
    hasData = h.projects ? ((h.projects[repo] || {}).issues > 0) : h.issues > 0;
  }
  STORE_API = hasData ? "/api/store" : null;
}

// Fills the header selector from /api/projects; without it the selector stays hidden.
async function loadProjects() {
  const sel = document.getElementById("project");
  try {
    const r = await fetch("/api/projects", { headers: { Accept: "application/json" } });
    if (r.status !== 200) return;
    const list = await r.json();
    if (!Array.isArray(list) || !list.length) return;
    // A notification names the project by slug only: map it to the repository.
    const url = new URL(location.href);
    const slug = url.searchParams.get("project");
    const hit = slug && !url.searchParams.get("repo") ? list.find((p) => p.slug === slug) : null;
    if (hit) {
      url.searchParams.set("repo", hit.external_id);
      url.searchParams.delete("project");
      history.replaceState(null, "", url);
    }
    const current = getRepo();
    const repos = list.map((p) => p.external_id);
    if (!repos.includes(current)) repos.push(current);
    sel.textContent = "";
    for (const repo of repos) {
      const o = document.createElement("option");
      o.value = repo;
      o.textContent = repo;
      sel.appendChild(o);
    }
    sel.value = current;
    sel.hidden = false;
  } catch (e) { /* no project API: keep the current behavior */ }
}

async function detectApi() {
  if (location.hostname !== "app.tradvia.org") return;
  try {
    const r = await fetch("/api/healthz", { headers: { Accept: "application/json" } });
    if (r.status === 200 && (await r.json()).ok === true) GH_API = "/api/github";
  } catch (e) { /* keep calling GitHub directly */ }
  if (GH_API !== "/api/github") return;
  try {
    const r = await fetch("/api/store/health", { headers: { Accept: "application/json" } });
    if (r.status === 200) {
      const h = await r.json();
      if (h.ok === true) storeHealth = h;
    }
  } catch (e) { /* keep using the proxy */ }
  await loadProjects();
}

// Sign in with GitHub (ADR 0008). Without a session everything stays visible, read-only.
// The GitHub token never reaches this page: only the login, avatar, roles and a CSRF value.
let authState = null; // answer of /api/auth/me; null while unknown or when the API is absent

async function loadAuth() {
  if (GH_API !== "/api/github") return;
  try {
    const r = await fetch("/api/auth/me", { headers: { Accept: "application/json" }, credentials: "same-origin" });
    if (r.status === 200) authState = await r.json();
  } catch (e) { /* no auth API: the button stays hidden */ }
  renderAuth();
  if (authState && authState.authenticated === true) {
    if (pushKey === null) loadPushKey(); else renderNotify();
    if (inboxOpen) loadInbox();
  }
}

function renderAuth() {
  renderBell();
  const box = document.getElementById("auth");
  box.textContent = "";
  box.hidden = !(authState && authState.enabled === true);
  if (box.hidden) return;
  if (!authState.authenticated) {
    const a = document.createElement("a");
    a.className = "btn";
    a.href = "/api/auth/login?next=" + encodeURIComponent("/runs/?repo=" + getRepo());
    a.textContent = t("signIn");
    box.append(a);
    return;
  }
  if (typeof authState.avatar_url === "string" && authState.avatar_url.startsWith("https://avatars.githubusercontent.com/")) {
    const img = document.createElement("img");
    img.src = authState.avatar_url;
    img.alt = "";
    box.append(img);
  }
  const mine = (authState.projects || []).find((p) => p.external_id === getRepo());
  const who = document.createElement("span");
  who.textContent = authState.login + " · " + t("role") + ": " + ((mine && mine.role) || t("noRole"));
  const out = document.createElement("button");
  out.textContent = t("signOut");
  out.addEventListener("click", signOut);
  box.append(who, out);
}

async function signOut() {
  try {
    await fetch("/api/auth/logout", {
      method: "POST",
      credentials: "same-origin",
      headers: { "X-Tradvia-CSRF": authState.csrf },
    });
  } catch (e) { /* the session expires by itself */ }
  authState = { enabled: true, authenticated: false };
  renderAuth();
}

// Panel actions run on GitHub as the signed-in user (ADR 0004 phase 2). The buttons exist only
// for who has the role; the server checks the role again on every request.
function myRights() {
  if (!authState || authState.authenticated !== true) return null;
  const p = (authState.projects || []).find((x) => x.external_id === getRepo());
  return p && p.role ? p : null;
}

async function panelRequest(method, path, body) {
  const headers = { Accept: "application/json" };
  if (method !== "GET") {
    const key = (crypto.randomUUID ? crypto.randomUUID() : "k" + Date.now() + Math.random().toString(36).slice(2))
      .replace(/[^A-Za-z0-9_-]/g, "-");
    Object.assign(headers, {
      "Content-Type": "application/json", "X-Tradvia-CSRF": authState.csrf, "X-Tradvia-Idempotency-Key": key,
    });
  }
  try {
    const r = await fetch("/api/projects/" + getRepo() + path, {
      method, headers, credentials: "same-origin", body: method !== "GET" ? JSON.stringify(body || {}) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    return r.ok ? { ok: true, data: j } : { ok: false, error: j.error || t("actionFailed") };
  } catch (e) {
    return { ok: false, error: t("actionFailed") };
  }
}

// Runs a POST from the controls inside `host`; shows the server's message when it fails.
async function runAction(host, path, body) {
  host.querySelectorAll(".action-error").forEach((n) => n.remove());
  host.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  const res = await panelRequest("POST", path, body);
  if (res.ok) { await refresh(); return; }
  host.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  host.append(el("div", res.error, "msg error action-error"));
}

function actionButton(host, label, path, body) {
  const b = el("button", label);
  b.type = "button";
  b.addEventListener("click", (e) => { e.stopPropagation(); runAction(host, path, typeof body === "function" ? body() : body); });
  return b;
}

// Audit entries (and, for who may answer it, the full plan) of one card; null when unavailable.
async function loadCardInfo(number) {
  if (!myRights()) return null;
  const res = await panelRequest("GET", "/cards/" + number + "/audit");
  return res.ok ? res.data : null;
}

function auditText(e) {
  return "@" + e.actor_login + " " + (t("act_" + e.action) || e.action) + " · " + (t("res_" + e.result) || e.result);
}

async function fillAudit(root, number) {
  const info = await loadCardInfo(number);
  if (!info || !info.audit.length) return;
  const ul = el("ul");
  info.audit.forEach((e) => {
    const li = el("li");
    li.append(el("span", auditText(e)), el("span", " · " + fmtTime(e.created_at), "when"));
    ul.append(li);
  });
  root.append(el("h4", t("auditLog")), ul);
}

function renderApproval(card, number) {
  const box = el("div", null, "approval");
  box.addEventListener("click", (e) => e.stopPropagation());
  card.append(box);
  loadCardInfo(number).then((info) => {
    if (!info || !info.awaiting_plan || !info.plan) return;
    const text = el("textarea");
    text.rows = 2; text.maxLength = 2000; text.placeholder = t("adjustHint");
    const path = "/cards/" + number + "/reply";
    box.append(
      el("h4", t("plan")), el("pre", info.plan, "plan"), text,
      actionButton(box, t("approve"), path, { decision: "approve" }),
      actionButton(box, t("reject"), path, { decision: "reject" }),
      actionButton(box, t("adjustBtn"), path, () => ({ decision: "adjust", text: text.value })),
    );
  });
}

// Review and merge a pull request, with the user's own GitHub token (ADR 0007). Everything is
// text (textContent only); the server checks role, checks and CSRF again on every write.
const CHECK_CLASS = { passed: "ok", failed: "bad", pending: "run", missing: "neutral" };

function encodePath(p) { return p.split("/").map(encodeURIComponent).join("/"); }

function toggleDiff(li, n, file) {
  const open = li.querySelector("pre");
  if (open) { open.remove(); return; }
  const pre = el("pre", t("loadingDiff"));
  li.append(pre);
  panelRequest("GET", "/pulls/" + n + "/files/" + encodePath(file.filename) + "/diff").then((res) => {
    pre.textContent = !res.ok ? res.error : res.data.diff === null ? t("noDiff") : res.data.diff + (res.data.truncated ? "\n…" : "");
  });
}

async function renderPull(box, n) {
  box.className = "pull";
  box.textContent = t("loadingPull");
  const res = await panelRequest("GET", "/pulls/" + n);
  box.replaceChildren();
  if (!res.ok) { box.append(el("div", res.error, "msg error action-error")); return; }
  const p = res.data;
  const title = el("div");
  const link = el("a", "#" + p.number + " " + p.title);
  const href = safeGithubUrl(p.html_url);
  if (href) { link.href = href; link.target = "_blank"; link.rel = "noopener"; }
  title.append(el("h4", t("pullRequest")), link, el("span", " · " + t("pr_" + p.state), "sub"));
  box.append(title);
  const ex = p.executor || {};
  if (ex.summary) box.append(el("h4", t("executorSummary")), el("pre", ex.summary));
  if (ex.cost_usd !== null && ex.cost_usd !== undefined) {
    box.append(el("div", "$" + ex.cost_usd.toFixed(4) + " · " + t("costLabel"), "sub"));
  }
  if (p.description) box.append(el("h4", t("description")), el("pre", p.description));

  box.append(el("h4", t("changedFiles")));
  const files = el("ul");
  p.files.forEach((f) => {
    const li = el("li");
    const b = el("button", f.filename, "file");
    b.type = "button";
    b.disabled = !f.has_diff;
    b.addEventListener("click", () => toggleDiff(li, p.number, f));
    li.append(b, el("span", " +" + f.additions, "ok"), el("span", " −" + f.deletions, "bad"));
    files.append(li);
  });
  box.append(files);

  box.append(el("h4", t("checks")));
  const checks = el("ul");
  p.checks.forEach((c) => {
    const li = el("li");
    li.append(el("span", c.name + ": "), el("span", t("check_" + c.state), CHECK_CLASS[c.state]));
    checks.append(li);
  });
  box.append(checks);

  if (p.review_comments.length) {
    box.append(el("h4", t("reviewComments")));
    const list = el("ul");
    p.review_comments.forEach((c) => {
      const li = el("li");
      li.append(el("span", "@" + c.author + (c.path ? " (" + c.path + ")" : "") + ": "), el("span", c.body || c.state));
      list.append(li);
    });
    box.append(list);
  }

  if (p.state !== "open") return;
  const path = "/pulls/" + p.number;
  const claFailed = p.checks.some((c) => c.name === "cla" && c.state === "failed");
  const acts = el("div", null, "acts");
  let ignore = null;
  if (p.can.merge_pr) {
    if (claFailed) {
      ignore = el("input");
      ignore.type = "checkbox";
      const label = el("label", null, "sub");
      label.append(ignore, document.createTextNode(" " + t("ignoreCla")));
      acts.append(label);
    }
    acts.append(actionButton(box, t("merge"), path + "/merge", () => ({ ignore_cla: !!(ignore && ignore.checked) })));
  }
  if (p.can.update_branch && p.behind) acts.append(actionButton(box, t("updateBranch"), path + "/update-branch", {}));
  if (acts.children.length) box.append(acts);
}

// Deploys waiting for approval in the protected environment, and the post-deploy operation.
let deploysToken = 0;

async function renderDeploys() {
  const section = document.getElementById("deploys-section");
  const box = document.getElementById("deploys");
  const mine = myRights();
  section.hidden = !mine;
  box.replaceChildren();
  if (!mine) return;
  const mineToken = ++deploysToken;
  const res = await panelRequest("GET", "/deployments/pending");
  if (mineToken !== deploysToken) return; // a newer render took over
  if (!res.ok) { box.append(el("div", res.error, "msg error action-error")); return; }
  const d = res.data;
  if (!d.deploys.length) box.append(el("div", t("noDeploys"), "sub"));
  const list = el("ul");
  d.deploys.forEach((x) => {
    const li = el("li");
    const link = el("a", "#" + x.run_id + " " + (x.title || ""));
    const href = safeGithubUrl(x.html_url);
    if (href) { link.href = href; link.target = "_blank"; link.rel = "noopener"; }
    li.append(link, el("span", " · " + (x.environments || []).join(", ") + " · " + fmtTime(x.created_at), "sub"));
    if (x.replaced) li.append(el("span", " · " + t("replaced"), "badge"));
    if (d.can.approve_deploy) {
      const base = "/deployments/" + x.run_id;
      const acts = el("div", null, "acts");
      if (x.replaced) acts.append(actionButton(li, t("cancelRun"), base + "/cancel", {}));
      else if (x.can_approve) {
        acts.append(actionButton(li, t("approve"), base + "/approve", {}), actionButton(li, t("reject"), base + "/reject", {}));
      }
      li.append(acts);
    }
    list.append(li);
  });
  box.append(list);
  if (!d.can.approve_deploy) return;
  const op = el("div", null, "op");
  const backfill = el("input");
  backfill.type = "checkbox";
  const bl = el("label", null, "sub");
  bl.append(backfill, document.createTextNode(" backfill"));
  const backlog = el("input");
  backlog.type = "text";
  backlog.value = d.backlog || "";
  backlog.setAttribute("aria-label", "backlog");
  backlog.placeholder = "44 50 45";
  op.append(el("h4", t("postDeploy")), bl, backlog,
    actionButton(op, t("runPostDeploy"), "/operations/post-deploy", () => ({ backfill: backfill.checked, backlog: backlog.value })));
  box.append(op);
}

// Dashboard reads: from the store when available; any failed call is retried through GH_API.
async function getData(repo, path) {
  if (STORE_API) {
    try {
      return await getJson(STORE_API + "/repos/" + repo + path);
    } catch (e) {
      dataSource = "GitHub";
    }
  }
  return getJson(GH_API + "/repos/" + repo + path);
}

// In-memory cache of timelines (promises): one request per card.
const timelineCache = new Map();

function loadTimeline(repo, n) {
  const key = repo + "#" + n;
  if (!timelineCache.has(key)) {
    const p = getJson(GH_API + "/repos/" + repo + "/issues/" + n + "/timeline?per_page=100")
      .then(buildTimeline);
    p.catch(() => timelineCache.delete(key));
    timelineCache.set(key, p);
  }
  return timelineCache.get(key);
}

// The Backlog column exists only when the store API answers; any failure hides it.
async function loadBacklog(repo) {
  if (!STORE_API) return null;
  try {
    const items = await getJson(STORE_API + "/repos/" + repo + "/backlog");
    return Array.isArray(items) ? items : null;
  } catch (e) {
    return null;
  }
}

const BACKLOG_STATUS_KEY = { "pronto": "pronto", "bloqueado": "bloqueado", "em andamento": "andamento", "concluído": "concluido" };

async function loadData(repo) {
  dataSource = STORE_API ? "Tradvia" : "GitHub";
  const [agent, claude, issues, prs] = await Promise.all([
    getData(repo, "/actions/workflows/agent.yml/runs?per_page=30"),
    getData(repo, "/actions/workflows/claude.yml/runs?per_page=30"),
    getData(repo, "/issues?labels=agent:ready&state=all&per_page=50"),
    getData(repo, "/pulls?state=all&per_page=50"),
  ]);
  const agentRuns = tagRuns("agent.yml", agent);
  const runs = agentRuns.concat(tagRuns("claude.yml", claude))
    .sort((a, b) => Date.parse(b.run_started_at || b.created_at) - Date.parse(a.run_started_at || a.created_at));
  return { agentRuns, runs, issues: issues.filter((i) => !i.pull_request), prs, backlog: await loadBacklog(repo) };
}

/* ---------- Pending inbox and notifications (docs/notifications.md, ADR 0009) ---------- */

const PUSH_KINDS = ["plan_ready", "agent_question", "pr_opened", "budget_limit", "adjust_limit"];
let inboxOpen = false;
let inboxData = []; // [{ repo, items }] of the projects that have something pending
let pushKey = null; // VAPID public key; null while unknown or when notifications are off
let pushError = "";

function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

function pendingTotal() {
  if (!authState || authState.authenticated !== true) return 0;
  return (authState.projects || []).reduce((n, p) => n + (p.pending_count || 0), 0);
}

function renderBell() {
  const bell = document.getElementById("bell");
  const signedIn = !!(authState && authState.authenticated === true);
  bell.hidden = !signedIn;
  document.getElementById("inbox").hidden = !(signedIn && inboxOpen);
  if (!signedIn) return;
  const n = pendingTotal();
  document.getElementById("bell-count").textContent = String(n);
  bell.classList.toggle("has", n > 0);
  bell.title = t("inbox") + ": " + n;
}

// A direct link to the card: opening it shows the reply, approve or merge controls (#46).
function cardLink(repo, number) {
  return "?repo=" + encodeURIComponent(repo) + "&card=" + number;
}

function renderInbox() {
  const root = document.getElementById("inbox-list");
  root.replaceChildren();
  const groups = inboxData.filter((g) => g.items.length);
  if (!groups.length) root.append(el("div", t("inboxEmpty"), "when"));
  for (const g of groups) {
    root.append(el("h3", g.repo));
    const ul = el("ul");
    for (const it of g.items) {
      const li = el("li");
      const a = el("a", "#" + it.number + " " + it.title);
      a.href = cardLink(g.repo, it.number);
      li.append(a, el("span", t("kind_" + it.kind) || it.kind, "badge"));
      ul.append(li);
    }
    root.append(ul);
  }
}

async function loadInbox() {
  const projects = (authState && authState.projects) || [];
  const found = [];
  for (const p of projects) {
    if (!p.role) continue;
    try {
      const r = await fetch("/api/projects/" + p.external_id + "/pending",
        { headers: { Accept: "application/json" }, credentials: "same-origin" });
      if (!r.ok) continue;
      const j = await r.json();
      p.pending_count = j.count;
      found.push({ repo: p.external_id, items: j.items });
    } catch (e) { /* the inbox just shows what it could load */ }
  }
  inboxData = found;
  renderBell();
  renderInbox();
  renderNotify();
}

function b64urlToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function loadPushKey() {
  if (!pushSupported() || GH_API !== "/api/github") return;
  try {
    const r = await fetch("/api/push/key", { headers: { Accept: "application/json" } });
    if (r.ok) pushKey = (await r.json()).key || null;
  } catch (e) { /* notifications stay hidden */ }
  renderNotify();
}

async function currentSubscription() {
  const reg = await navigator.serviceWorker.getRegistration("sw.js");
  return reg ? reg.pushManager.getSubscription() : null;
}

async function enablePush() {
  pushError = "";
  try {
    if ((await Notification.requestPermission()) !== "granted") throw new Error(t("pushDenied"));
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(pushKey) }));
    const res = await panelRequest("POST", "/push/subscription", sub.toJSON());
    if (!res.ok) throw new Error(res.error);
  } catch (e) {
    pushError = e && e.message ? e.message : t("actionFailed");
  }
  renderNotify();
}

async function disablePush() {
  pushError = "";
  try {
    const sub = await currentSubscription();
    if (sub) await panelRequest("DELETE", "/push/subscription", { endpoint: sub.endpoint });
  } catch (e) { pushError = t("actionFailed"); }
  renderNotify();
}

async function renderNotify() {
  const box = document.getElementById("notify");
  const mine = myRights();
  box.hidden = !(inboxOpen && pushKey && pushSupported() && mine);
  if (box.hidden) return;
  const token = ++notifyToken;
  const [sub, prefs] = await Promise.all([currentSubscription().catch(() => null), panelRequest("GET", "/push/prefs")]);
  if (token !== notifyToken) return;
  box.replaceChildren(el("h3", t("notifications") + " · " + getRepo()));
  const toggle = el("button", sub ? t("disableNotify") : t("enableNotify"));
  toggle.type = "button";
  toggle.addEventListener("click", () => { toggle.disabled = true; (sub ? disablePush : enablePush)(); });
  box.append(toggle);
  if (pushError) box.append(el("div", pushError, "msg error"));
  if (!prefs.ok) return;
  box.append(el("div", t("notifyEvents"), "when"));
  for (const kind of PUSH_KINDS) {
    const label = el("label");
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = prefs.data.kinds[kind] !== false;
    cb.addEventListener("change", async () => {
      const res = await panelRequest("PUT", "/push/prefs", { kinds: { [kind]: cb.checked } });
      if (!res.ok) { cb.checked = !cb.checked; pushError = res.error; renderNotify(); }
    });
    label.append(cb, document.createTextNode(t("kind_" + kind)));
    box.append(label);
  }
}
let notifyToken = 0;

document.getElementById("bell").addEventListener("click", () => {
  inboxOpen = !inboxOpen;
  renderBell();
  if (inboxOpen) loadInbox();
});

// ?card=N (from the inbox or a notification): open that card once the board is on screen.
let cardToOpen = (() => {
  const n = Number(new URLSearchParams(location.search).get("card"));
  return Number.isInteger(n) && n > 0 ? n : null;
})();

function openRequestedCard() {
  if (cardToOpen === null) return;
  const node = document.getElementById("card-" + cardToOpen);
  if (!node) return;
  const n = cardToOpen;
  cardToOpen = null;
  node.scrollIntoView({ block: "center" });
  if (!openCards.has(n)) node.click();
}

/* ---------- Rendering ---------- */

let lang = (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en";
let showSkipped = false;
let data = null;
// auto-refresh (pure)
// The panel reloads by itself while the tab is visible, but never while someone is typing
// or another load is running. Reads from the store are cheap (no GitHub rate limit), so it
// can poll more often there than through the GitHub proxy.
const AUTO_REFRESH_STORE_MS = 30000;
const AUTO_REFRESH_PROXY_MS = 60000;
function autoRefreshDue(s) {
  if (!s.enabled || s.hidden || s.editing || s.busy) return false;
  const interval = s.store ? AUTO_REFRESH_STORE_MS : AUTO_REFRESH_PROXY_MS;
  return s.lastAt == null || s.now - s.lastAt >= interval;
}
// end auto-refresh

let fetchState = "loading"; // loading | ok | ratelimit | error
let updatedAt = null;
const t = (k) => I18N[lang][k];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function statusInfo(run) {
  if (run.status !== "completed") return [run.status === "queued" ? "queued" : t("inProgress"), "run"];
  const c = run.conclusion || "completed";
  return [c, c === "success" ? "ok" : c === "failure" || c === "timed_out" ? "bad" : "neutral"];
}

function renderKpis(view) {
  const root = document.getElementById("kpis");
  root.replaceChildren();
  const k = computeKpis(view.runs, view.prs);
  const c = filteredCostKpis(view);
  const usd = (v) => (v == null ? null : "$" + v.toFixed(4));
  const tok = (n) => (n == null ? null : formatTokens(n));
  // [label, value, hint]: a null value shows "—" with the hint as tooltip.
  const items = [
    [t("success"), k.successRate == null ? null : Math.round(k.successRate * 100) + "%"],
    [t("medDur"), k.medianDurationMs == null ? null : formatDuration(k.medianDurationMs)],
    [t("mergedPrs"), String(k.mergedPrs)],
    [t("medPr"), k.medianPrMs == null ? null : formatDuration(k.medianPrMs)],
    [t("cardsInPeriod"), String(c.cards)],
    [t("costTotal") + " (" + t("planPlusExec") + ")", usd(c.totalUsd), t("noData")],
    [t("costMedian"), usd(c.medianUsd), t("noData")],
    [t("costPerPr"), usd(c.perMergedPrUsd), t("noData")],
    [t("tokensTotal") + " · " + t("tokensIn"), c.tokens && tok(c.tokens.in), t("noData")],
    [t("tokensTotal") + " · " + t("tokensOut"), c.tokens && tok(c.tokens.out), t("noData")],
    [t("tokensTotal") + " · " + t("tokensCache"), c.tokens && tok(c.tokens.cache), t("noData")],
    [t("tokensPerCard"), tok(c.medianTokens), t("noData")],
  ];
  for (const [l, v, hint] of items) {
    const d = el("div", null, "kpi");
    const val = el("div", v == null ? "—" : v, "v");
    if (v == null) val.title = hint || t("noData");
    d.append(val, el("div", l, "l"));
    root.append(d);
  }
}

function svgEl(tag, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, String(v));
  return n;
}

// Plain SVG bars, one per day; the <title> of each bar is its tooltip.
function renderBarChart(title, series, key, fmt) {
  const box = el("div", null, "chart");
  box.append(el("div", title, "l"));
  const W = 300, H = 80;
  if (!series.some((s) => s[key] > 0)) {
    const none = el("div", "—", "v");
    none.title = t("noData");
    box.append(none);
    return box;
  }
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img", "aria-label": title });
  for (const b of barChartModel(series, key, W, H)) {
    const r = svgEl("rect", { x: b.x.toFixed(2), y: b.y.toFixed(2), width: b.w.toFixed(2), height: b.h.toFixed(2) });
    const tip = svgEl("title");
    tip.textContent = b.day + ": " + fmt(b.value);
    r.append(tip);
    svg.append(r);
  }
  box.append(svg, el("div", series[0].day + " → " + series[series.length - 1].day, "sub"));
  return box;
}

function renderCharts(view) {
  const root = document.getElementById("charts");
  const series = dailySeries(view, filters, Date.now());
  root.replaceChildren(
    renderBarChart(t("chartCost"), series, "usd", (v) => "$" + v.toFixed(4)),
    renderBarChart(t("chartTokens"), series, "tokens", formatTokens));
}

let filters = parseFilters(location.search);

function setFilters(next) {
  filters = next;
  history.replaceState(null, "", location.pathname + filtersToSearch(filters, location.search) + location.hash);
  render();
}

function periodChoice(f) {
  if (!f.from && !f.to) return "all";
  return PRESET_DAYS[f.from] ? f.from : "custom";
}

function renderFilters() {
  const root = document.getElementById("filters");
  root.replaceChildren();
  const field = (label, control) => {
    const l = el("label", label + " ");
    l.append(control);
    root.append(l);
  };
  const select = (options, value, onChange) => {
    const s = document.createElement("select");
    for (const [v, text] of options) {
      const o = document.createElement("option");
      o.value = v; o.textContent = text;
      s.append(o);
    }
    s.value = value;
    s.addEventListener("change", () => onChange(s.value));
    return s;
  };
  const isoDay = (ms) => new Date(ms).toISOString().slice(0, 10);
  const choice = periodChoice(filters);
  field(t("fPeriod"), select(
    [["all", t("fAll")], ["7d", t("f7d")], ["30d", t("f30d")], ["90d", t("f90d")], ["custom", t("fCustom")]],
    choice, (v) => {
      if (v === "custom") setFilters({ ...filters, from: isoDay(Date.now() - 30 * DAY_MS), to: isoDay(Date.now()) });
      else setFilters({ ...filters, from: v === "all" ? null : v, to: null });
    }));
  if (choice === "custom") {
    const date = (key) => {
      const i = document.createElement("input");
      i.type = "date";
      i.value = filters[key] || "";
      i.addEventListener("change", () => setFilters({ ...filters, [key]: i.value || null }));
      return i;
    };
    field(t("fFrom"), date("from"));
    field(t("fTo"), date("to"));
  }
  field(t("fExecutor"), select(
    [["all", t("fAllM")], ["agent", t("fAgent")], ["claude", t("fClaude")]],
    filters.executor, (v) => setFilters({ ...filters, executor: v })));
  const cards = [["", t("fAllM")]].concat((data ? data.issues : []).map((i) => [String(i.number), "#" + i.number + " " + i.title]));
  field(t("fCard"), select(cards, filters.card ? String(filters.card) : "",
    (v) => setFilters({ ...filters, card: v ? parseInt(v, 10) : null })));
  field(t("fStatus"), select(
    [["all", t("fAllF")]].concat(STATES.map((s) => [s, t("ST_" + s)])),
    filters.status, (v) => setFilters({ ...filters, status: v })));
}

function fmtTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString(lang === "pt" ? "pt-BR" : "en-GB");
}

function eventText(it) {
  const who = it.actor ? "@" + it.actor : "";
  switch (it.textKey) {
    case "started": return t("cardStarted") + " " + who;
    case "awaiting": return t("awaiting") + " — " + who;
    case "planPosted": return who + " " + t("planPosted");
    case "approved": case "rejected": case "adjust": return t(it.textKey) + " " + t("by") + " " + who;
    case "noEffect": return t("noEffect") + " " + who + " " + t("noEffectSuffix");
    case "openedPr": return who + " " + t("openedPr") + (it.detail && it.detail.number ? " #" + it.detail.number : "");
    case "claudeCode": return t("claudeCode") + (it.detail && it.detail.status ? ": " + it.detail.status : "");
    case "done": return t("done");
    default: return "";
  }
}

function renderEventLi(it, withCard) {
  const li = el("li");
  if (withCard) li.append(el("strong", "#" + it.cardNumber + " "));
  li.append(el("span", eventText(it)), el("span", " · " + fmtTime(it.time), "when"));
  if (it.url) {
    const a = el("a", " ↗");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    li.append(a);
  }
  if (it.kind === "plan" && it.detail && (it.detail.summary || it.detail.steps.length)) {
    const det = el("details");
    det.append(el("summary", t("plan")));
    if (it.detail.summary) det.append(el("div", it.detail.summary));
    if (it.detail.steps.length) {
      const ol = el("ol");
      it.detail.steps.forEach((s) => ol.append(el("li", s.replace(/^\d+\.\s*/, ""))));
      det.append(el("div", t("steps"), "when"), ol);
    }
    li.append(det);
  }
  return li;
}

// Fills `root` with a message or a list for a timeline promise.
async function fillActivity(root, number, withCard) {
  root.replaceChildren(el("div", t("loadingActivity"), "when"));
  try {
    const items = await loadTimeline(getRepo(), number);
    if (!items.length) { root.replaceChildren(el("div", t("noActivity"), "when")); return; }
    const ul = el("ul");
    items.forEach((it) => ul.append(renderEventLi(it, withCard)));
    root.replaceChildren(ul);
  } catch (e) {
    root.replaceChildren(el("div", e instanceof RateLimitError ? t("activityRateLimit") : t("activityError"), "msg error"));
  }
}

const openCards = new Set();
let recentState = { status: "idle", items: [] }; // idle | loading | ok | ratelimit | error
let recentToken = 0;

function renderRecent() {
  const root = document.getElementById("recent");
  root.replaceChildren();
  if (recentState.status === "loading") root.append(el("div", t("loadingActivity"), "when"));
  else if (recentState.status === "ratelimit") root.append(el("div", t("activityRateLimit"), "msg error"));
  else if (recentState.status === "error") root.append(el("div", t("activityError"), "msg error"));
  else if (!recentState.items.length) root.append(el("div", t("noActivity"), "when"));
  else {
    const ul = el("ul");
    recentState.items.forEach((it) => ul.append(renderEventLi(it, true)));
    root.append(ul);
  }
}

// Loads up to 5 timelines after the initial render, without blocking the board.
async function loadRecent() {
  const token = ++recentToken;
  const repo = getRepo();
  recentState = { status: "loading", items: [] };
  renderRecent();
  const cards = [];
  try {
    for (const issue of pickCardsForRecent(data.issues, 5)) {
      const items = await loadTimeline(repo, issue.number);
      if (token !== recentToken) return;
      cards.push({ number: issue.number, title: issue.title, items });
    }
    recentState = { status: "ok", items: recentActivity(cards, 10) };
  } catch (e) {
    if (token !== recentToken) return;
    recentState = { status: e instanceof RateLimitError ? "ratelimit" : "error", items: recentActivity(cards, 10) };
  }
  renderRecent();
}

function renderBacklogColumn(root, backlog) {
  const c = el("div", null, "col BACKLOG_ITEMS");
  const h = el("h3");
  h.append(el("span", t("backlog")), el("span", String(backlog.length)));
  c.append(h);
  const me = myRights();
  const canStart = !!(me && me.can_start);
  if (canStart) c.append(renderNewCard());
  const inBacklog = new Set(backlog.map((b) => b.issue_number));
  for (const [i, b] of backlog.entries()) {
    const card = el("div", null, "card");
    card.id = "bl-" + b.issue_number;
    const key = BACKLOG_STATUS_KEY[b.status] || "bloqueado";
    const head = el("div", null, "n");
    head.append(el("span", t("position") + " " + (b.position + 1) + " · #" + b.issue_number),
      el("span", t("st_" + key), "badge " + key));
    card.append(head, el("div", b.title || "#" + b.issue_number));
    if (b.depends_on.length) {
      const deps = el("div", t("dependsOn") + " ", "cost");
      b.depends_on.forEach((d, i) => {
        if (i) deps.append(document.createTextNode(", "));
        if (inBacklog.has(d)) {
          const a = el("a", "#" + d);
          a.href = "#bl-" + d;
          deps.append(a);
        } else deps.append(document.createTextNode("#" + d));
      });
      card.append(deps);
    }
    if (canStart) {
      const acts = el("div", null, "acts");
      const move = (dir) => ({ issue: b.issue_number, direction: dir });
      if (key === "pronto" || key === "bloqueado") {
        acts.append(actionButton(card, t("startCard"), "/cards/" + b.issue_number + "/start", {}));
      }
      if (i > 0) acts.append(actionButton(card, "↑", "/backlog", move("up")));
      if (i < backlog.length - 1) acts.append(actionButton(card, "↓", "/backlog", move("down")));
      acts.querySelectorAll("button").forEach((x) => {
        if (x.textContent === "↑") x.title = t("moveUp");
        if (x.textContent === "↓") x.title = t("moveDown");
      });
      card.append(acts);
    }
    c.append(card);
  }
  root.append(c);
}

function renderNewCard() {
  const box = el("div");
  const open = el("button", t("newCard"));
  open.type = "button";
  const form = el("div", null, "newcard");
  form.hidden = true;
  const title = el("input");
  title.maxLength = 256; title.placeholder = t("cardTitle");
  const desc = el("textarea");
  desc.rows = 3; desc.maxLength = 10000; desc.placeholder = t("cardDescription");
  const cancel = el("button", t("cancel"));
  cancel.type = "button";
  const create = actionButton(form, t("create"), "/cards", () => ({ title: title.value, description: desc.value }));
  const row = el("div", null, "acts");
  row.append(create, cancel);
  form.append(title, desc, row);
  open.addEventListener("click", () => { form.hidden = false; open.hidden = true; title.focus(); });
  cancel.addEventListener("click", () => { form.hidden = true; open.hidden = false; });
  box.append(open, form);
  return box;
}

function renderBoard(issues, prs, agentRuns, backlog) {
  const root = document.getElementById("board");
  root.replaceChildren();
  root.classList.toggle("with-backlog", !!backlog);
  if (backlog) renderBacklogColumn(root, backlog);
  const cols = {};
  for (const s of STATES) {
    const c = el("div", null, "col " + s);
    cols[s] = el("div");
    c.append(el("h3"), cols[s]);
    root.append(c);
  }
  const counts = Object.fromEntries(STATES.map((s) => [s, 0]));
  for (const issue of issues) {
    const s = deriveCardState(issue, prs, agentRuns);
    counts[s]++;
    const card = el("div", null, "card");
    card.id = "card-" + issue.number;
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    const a = el("a", issue.title);
    a.href = issue.html_url;
    a.target = "_blank"; a.rel = "noopener";
    a.addEventListener("click", (e) => e.stopPropagation());
    card.append(el("div", "#" + issue.number, "n"), a);
    const cost = cardCosts(issue, issue.tradvia_plan_cost, prs);
    if (cost) {
      card.append(el("div", "$" + cost.usd.toFixed(4) + " · " + formatTokens(cost.in + cost.out + cost.cache) +
        " tokens · " + t("costLabel"), "cost"));
    }
    const panel = el("div", null, "activity");
    panel.hidden = true;
    panel.addEventListener("click", (e) => e.stopPropagation());
    const toggle = () => {
      const open = panel.hidden;
      panel.hidden = !open;
      card.setAttribute("aria-expanded", String(open));
      if (open) {
        openCards.add(issue.number);
        panel.replaceChildren(el("h4", t("activity")), el("div"));
        fillActivity(panel.lastChild, issue.number, false);
        const audit = el("div");
        panel.append(audit);
        fillAudit(audit, issue.number);
        const pr = prs.find((p) => p.state === "open" && branchMatchesIssue(p.head && p.head.ref, issue.number));
        if (pr && myRights()) {
          const pull = el("div");
          panel.append(pull);
          renderPull(pull, pr.number);
        }
      } else openCards.delete(issue.number);
    };
    card.addEventListener("click", toggle);
    card.addEventListener("keydown", (e) => {
      if (e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(); }
    });
    card.append(panel);
    const mine = myRights();
    // While the agent waits for the answer its run is still in progress, so the card shows as
    // AGENT_WORKING: offer the answer there too. renderApproval adds controls only when the
    // server says the agent's last comment is the plan.
    if ((s === "WAITING_HUMAN" || s === "AGENT_WORKING") && mine && mine.can_approve) {
      renderApproval(card, issue.number);
    }
    if (openCards.has(issue.number)) { panel.hidden = true; toggle(); }
    cols[s].append(card);
  }
  STATES.forEach((s) => {
    const h = cols[s].parentNode.firstChild;
    h.append(el("span", t("COL_" + s)), el("span", String(counts[s])));
    if (!counts[s]) cols[s].append(el("div", t("emptyCards"), "sub"));
  });
}

function renderRuns(runs) {
  const root = document.getElementById("runs");
  root.replaceChildren();
  if (!runs.length) { root.append(el("div", t("emptyRuns"), "msg")); return; }
  const wrap = el("div", null, "tablewrap");
  const table = el("table");
  const head = el("tr");
  ["executor", "runTitle", "event", "status", "duration", "started", "link"]
    .forEach((k) => head.append(el("th", t(k))));
  table.append(head);
  for (const r of runs) {
    const tr = el("tr");
    const [st, cls] = statusInfo(r);
    const dur = r.status === "completed" ? formatDuration(runDuration(r)) : "—";
    const started = r.run_started_at ? new Date(r.run_started_at).toLocaleString(lang === "pt" ? "pt-BR" : "en-GB") : "—";
    tr.append(
      el("td", EXECUTORS[r.workflowFile]),
      el("td", r.display_title || r.name || "", "title"),
      el("td", r.event),
      el("td", st, cls),
      el("td", dur),
      el("td", started)
    );
    const td = el("td");
    const a = el("a", t("open"));
    a.href = r.html_url; a.target = "_blank"; a.rel = "noopener";
    td.append(a); tr.append(td);
    table.append(tr);
  }
  wrap.append(table);
  root.append(wrap);
}

function render() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.getElementById("lang").value = lang;
  renderAuth();
  document.getElementById("meta").textContent =
    getRepo() + (updatedAt ? " · " + t("updated") + " " + updatedAt.toLocaleTimeString() : "") +
    (updatedAt ? " · " + t("dataFrom") + ": " + dataSource : "");
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  document.getElementById("refresh").disabled = fetchState === "loading";
  status.hidden = fetchState === "ok";
  status.className = "msg" + (fetchState === "ratelimit" || fetchState === "error" ? " error" : "");
  status.textContent = fetchState === "loading" ? t("loading")
    : fetchState === "ratelimit" ? t("rateLimit") : fetchState === "error" ? t("error") : "";
  content.hidden = fetchState !== "ok" || !data;
  if (!content.hidden) {
    renderRecent();
    const view = applyFilters(data, filters, Date.now());
    renderFilters();
    renderKpis(view);
    renderCharts(view);
    // Card states are derived from every PR and run, not only the filtered ones.
    renderBoard(view.issues, data.prs, data.agentRuns, data.backlog);
    renderDeploys();
    renderRuns(visibleRuns(view.runs, showSkipped));
    openRequestedCard();
  }
}

let loading = false;
let refreshAgain = false; // a refresh asked for while another was running (e.g. after an action)

// quiet: an automatic reload keeps the current data on screen until the new data arrives,
// and keeps it if the reload fails (the next manual refresh shows the error).
async function refresh(quiet = false) {
  if (loading) { refreshAgain = true; return; }
  loading = true;
  timelineCache.clear();
  if (!quiet) {
    recentToken++;
    recentState = { status: "idle", items: [] };
    fetchState = "loading";
    render();
  }
  try {
    selectStore(getRepo());
    const fresh = await loadData(getRepo());
    data = fresh;
    updatedAt = new Date();
    fetchState = "ok";
  } catch (e) {
    if (!quiet || !data) {
      data = null;
      fetchState = e instanceof RateLimitError ? "ratelimit" : "error";
    }
  } finally {
    loading = false;
  }
  render();
  if (authState && authState.authenticated === true) loadAuth(); // keeps the pending counter fresh
  if (fetchState === "ok") {
    if (quiet) recentToken++;
    loadRecent();
  }
  if (refreshAgain) { refreshAgain = false; refresh(true); }
}

function isEditing() {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" ||
            (a.tagName === "INPUT" && a.type !== "checkbox" && a.type !== "button"))) return true;
  if (document.querySelector(".newcard:not([hidden])")) return true;
  return [...document.querySelectorAll("#content textarea, #content input[type=text]")]
    .some((x) => x.value.trim() !== "");
}

function autoRefreshEnabled() {
  return document.getElementById("auto-refresh").checked;
}

try {
  if (localStorage.getItem("tradvia.autoRefresh") === "off") {
    document.getElementById("auto-refresh").checked = false;
  }
} catch (e) { /* storage unavailable: default on */ }
document.getElementById("auto-refresh").addEventListener("change", (e) => {
  try { localStorage.setItem("tradvia.autoRefresh", e.target.checked ? "on" : "off"); } catch (err) { /* ignore */ }
});

function tickAutoRefresh() {
  const due = autoRefreshDue({
    enabled: autoRefreshEnabled(), hidden: document.hidden, editing: isEditing(), busy: loading,
    store: !!STORE_API, lastAt: updatedAt ? updatedAt.getTime() : null, now: Date.now(),
  });
  if (due) refresh(true);
}
setInterval(tickAutoRefresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tickAutoRefresh(); });

document.getElementById("refresh").addEventListener("click", () => refresh());
document.getElementById("project").addEventListener("change", (e) => {
  const url = new URL(location.href);
  url.searchParams.set("repo", e.target.value);
  history.replaceState(null, "", url);
  refresh();
});
document.getElementById("lang").addEventListener("change", (e) => { lang = e.target.value; render(); });
document.getElementById("show-skipped").addEventListener("change", (e) => { showSkipped = e.target.checked; render(); });
detectApi().then(() => { loadAuth(); return refresh(); });
</script>
