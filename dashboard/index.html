      found.push({ repo: p.external_id, items: j.items });
    } catch (e) { /* the inbox just shows what it could load */ }
  }
  inboxData = found;
  renderBell();
  renderInbox();
  renderNotify();
}

function b64urlToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function loadPushKey() {
  if (!pushSupported() || GH_API !== "/api/github") return;
  try {
    const r = await fetch("/api/push/key", { headers: { Accept: "application/json" } });
    if (r.ok) pushKey = (await r.json()).key || null;
  } catch (e) { /* notifications stay hidden */ }
  renderNotify();
}

async function currentSubscription() {
  const reg = await navigator.serviceWorker.getRegistration("sw.js");
  return reg ? reg.pushManager.getSubscription() : null;
}

async function enablePush() {
  pushError = "";
  try {
    if ((await Notification.requestPermission()) !== "granted") throw new Error(t("pushDenied"));
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(pushKey) }));
    const res = await panelRequest("POST", "/push/subscription", sub.toJSON());
    if (!res.ok) throw new Error(res.error);
  } catch (e) {
    pushError = e && e.message ? e.message : t("actionFailed");
  }
  renderNotify();
}

async function disablePush() {
  pushError = "";
  try {
    const sub = await currentSubscription();
    if (sub) await panelRequest("DELETE", "/push/subscription", { endpoint: sub.endpoint });
  } catch (e) { pushError = t("actionFailed"); }
  renderNotify();
}

async function renderNotify() {
  const box = document.getElementById("notify");
  const mine = myRights();
  box.hidden = !(inboxOpen && pushKey && pushSupported() && mine);
  if (box.hidden) return;
  const token = ++notifyToken;
  const [sub, prefs] = await Promise.all([currentSubscription().catch(() => null), panelRequest("GET", "/push/prefs")]);
  if (token !== notifyToken) return;
  box.replaceChildren(el("h3", t("notifications") + " · " + getRepo()));
  const toggle = el("button", sub ? t("disableNotify") : t("enableNotify"));
  toggle.type = "button";
  toggle.addEventListener("click", () => { toggle.disabled = true; (sub ? disablePush : enablePush)(); });
  box.append(toggle);
  if (pushError) box.append(el("div", pushError, "msg error"));
  if (!prefs.ok) return;
  box.append(el("div", t("notifyEvents"), "when"));
  for (const kind of PUSH_KINDS) {
    const label = el("label");
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = prefs.data.kinds[kind] !== false;
    cb.addEventListener("change", async () => {
      const res = await panelRequest("PUT", "/push/prefs", { kinds: { [kind]: cb.checked } });
      if (!res.ok) { cb.checked = !cb.checked; pushError = res.error; renderNotify(); }
    });
    label.append(cb, document.createTextNode(t("kind_" + kind)));
    box.append(label);
  }
}
let notifyToken = 0;

document.getElementById("bell").addEventListener("click", () => {
  inboxOpen = !inboxOpen;
  renderBell();
  if (inboxOpen) loadInbox();
});

// ?card=N (from the inbox or a notification): open that card once the board is on screen.
let cardToOpen = (() => {
  const n = Number(new URLSearchParams(location.search).get("card"));
  return Number.isInteger(n) && n > 0 ? n : null;
})();
const deepLinkCard = cardToOpen; // kept for the note; cardToOpen is consumed once tried

// A one-line note above the board: a card that the filter or a link names is not on it.
function showBoardNote(text) {
  const note = document.getElementById("board-note");
  note.textContent = text || "";
  note.hidden = !text;
}

// The note for the ?card=N link while that card is not on the board. Derived on every render
// (a later render must not clear it), and gone as soon as the card is shown.
function deepLinkNote() {
  const n = deepLinkCard;
  if (!n || !data || document.getElementById("card-" + n)) return "";
  const onBoard = data.issues.some((i) => i.number === n);
  return t(onBoard ? "noteHiddenCard" : "noteDeepLinkCard").replace("{n}", String(n));
}

function openRequestedCard() {
  if (cardToOpen === null) return;
  const n = cardToOpen;
  cardToOpen = null; // one attempt: by the time this runs, data.issues has already loaded
  const node = document.getElementById("card-" + n);
  if (!node) {
    // A pending item the board cannot show (pending.py flags any open agent PR, labeled or not)
    // is still something to act on (ADR 0007): open the GitHub issue rather than do nothing.
    window.open("https://github.com/" + getRepo() + "/issues/" + n, "_blank", "noopener");
    return;
  }
  node.scrollIntoView({ block: "center" });
  if (dialogCard !== n) node.click();
}

// nav (pure)
// rights: null without a session (read-only), otherwise an object (role may be empty).
// Without a session Configurações is limited to language and theme.
const VIEWS = ["panel", "settings", "help"];
function navItems(rights) {
  return [
    { id: "panel", labelKey: "nav.panel", status: "ready" },
    // #58/ADR 0009: shipped (roles, secrets, GitHub Actions delivery), rendered inline at the
    // bottom of the panel view (#connections-section) rather than as its own routed view.
    // "soon" only for someone who cannot use the screen yet (no admin role on this project);
    // for an admin the link is live and scrolls there (see scrollToConnectionsIfLinked()).
    { id: "connections", labelKey: "nav.connections", status: rights && rights.can_manage_connections ? "ready" : "soon" },
    { id: "settings", labelKey: "nav.settings", status: "ready", limited: !rights },
    // Two different things used to both say "Ajuda" in the header: this one leaves the app for
    // the full README/guides page, the next opens the in-app help view. Keeping them side by
    // side in the same menu, with distinct labels, makes clear they're not the same link twice.
    { id: "docs", labelKey: "docs", status: "ready", href: "docs.html", external: true, titleKey: "docsTitle" },
    { id: "help", labelKey: "nav.help", status: "ready" },
  ];
}

function parseView(hash) {
  const v = String(hash || "").replace(/^#\/?/, "");
  return VIEWS.includes(v) ? v : "panel";
}
// end nav

// prefs (pure)
const PREFS_KEY = "tradvia.prefs";
const PREF_LANGS = ["pt", "en"];
const PREF_THEMES = ["dark", "light", "system"];
function prefsDefaults(navLang) {
  return { lang: String(navLang || "").toLowerCase().startsWith("pt") ? "pt" : "en", theme: "dark" };
}

function prefsLoad(storage, navLang) {
  const prefs = prefsDefaults(navLang);
  try {
    const raw = JSON.parse(storage.getItem(PREFS_KEY));

  } catch (e) { /* storage unavailable or corrupt: defaults */ }
  return prefs;
}

// pagination (pure)
const RUNS_PAGE_SIZE = 20;
function paginate(items, page, size) {
  const total = items.length;
  const pages = Math.max(1, Math.ceil(total / size));
  const p = Math.min(Math.max(0, Math.trunc(page) || 0), pages - 1);
  return { rows: items.slice(p * size, (p + 1) * size), page: p, pages, total };
}
// end pagination
// In-memory only: not persisted, and paginate() clamps it when the list shrinks.

// auto-refresh (pure)
// The panel reloads by itself while the tab is visible, but never while someone is typing
// or another load is running. A focused field always pauses it; an unfocused draft (a forgotten
// "Novo card" form or half-written comment) only pauses it until AUTO_REFRESH_IDLE_MS passes
// without edits, so an abandoned field cannot freeze the panel forever. Reads from the store
// are cheap (no GitHub rate limit), so it can poll more often there than through the GitHub proxy.
const AUTO_REFRESH_STORE_MS = 30000;
const AUTO_REFRESH_PROXY_MS = 60000;
const AUTO_REFRESH_IDLE_MS = 180000;
function editingActive(s) {
  if (s.focused) return true;
  if (!s.draft || s.lastEditAt == null) return false;
  return s.now - s.lastEditAt < AUTO_REFRESH_IDLE_MS;
}
function autoRefreshDue(s) {
  if (!s.enabled || s.hidden || s.editing || s.busy) return false;
  const interval = s.store ? AUTO_REFRESH_STORE_MS : AUTO_REFRESH_PROXY_MS;
  return s.lastAt == null || s.now - s.lastAt >= interval;
}
// end auto-refresh

// Loads up to 5 timelines after the initial render, without blocking the board.
async function loadRecent() {
  const token = ++recentToken;
  const repo = getRepo();
  recentState = { status: "loading", items: [] };
  renderRecent();
  const cards = [];
  try {
    for (const issue of pickCardsForRecent(data.issues, 5)) {
      const items = await loadTimeline(repo, issue.number);
      if (token !== recentToken) return;
      cards.push({ number: issue.number, title: issue.title, items });
    }
    recentState = { status: "ok", items: recentActivity(cards, 10) };
  } catch (e) {
    if (token !== recentToken) return;
    recentState = { status: e instanceof RateLimitError ? "ratelimit" : "error", items: recentActivity(cards, 10) };
  }
  renderRecent();
}

// sections live in `dialogRemote` and reload only when the card changes, so the board's refreshes

let dialogRemote = null;
let dialogRemoteKey = null;

const usdText = (v) => (v == null ? "—" : "$" + v.toFixed(4));

// Rebuilds the dialog from the data on screen; a refresh rebuilds only the local parts. It waits
// while the user is typing (unless `force`), so a reply in progress is not wiped.
function renderCardDialog(force) {
  if (dialogCard === null || !data) return;
  if (currentView() !== "panel") { closeCardDialog(); return; }
  if (!force && isEditing()) return;
  const n = dialogCard;
  const issue = data.issues.find((i) => i.number === n);
  const title = document.getElementById("card-dialog-title");
  const body = document.getElementById("card-dialog-body");
  if (!issue) {
    title.textContent = "#" + n;
    body.replaceChildren(el("div", t("dialogNotFound"), "msg"));
    dialogRemoteKey = null;
    return;
  }
  const state = deriveCardState(issue, data.prs, data.agentRuns);
  title.textContent = "#" + n + " " + issue.title;
  const href = safeGithubUrl(issue.html_url);
  if (href) {
    const link = el("a", t("dialogOpenGithub"));
    link.href = href; link.target = "_blank"; link.rel = "noopener";
    title.append(" ", link);
  }
  body.replaceChildren(agentsSection(issue), diagnosisSection(issue, state), dialogRemote);
  const prKey = data.prs
    .filter((p) => branchMatchesIssue(p.head && p.head.ref, n))
    .map((p) => p.number + ":" + p.state + ":" + (p.merged_at ? "m" : ""))
    .join(",");
  const key = [n, issue.updated_at || "", state, prKey].join("|");

}

// Tab stays inside the open dialog.
function trapFocus(e) {
  const box = document.querySelector("#card-dialog .dialog-box");
  const items = [...box.querySelectorAll("a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled])")];
  if (!items.length) { e.preventDefault(); return; }
  const first = items[0], last = items[items.length - 1];
  const active = document.activeElement;
  const inside = box.contains(active);
  if (e.shiftKey && (!inside || active === first)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (!inside || active === last)) { e.preventDefault(); first.focus(); }
}

// Project connections (ADR 0009), admin only. Secrets are write-only: the field is cleared
// after saving and the server only ever answers "configured at ... by ...".
let connState = null;
let connRepo = null;

async function connRequest(method, path, body) {
  const headers = { Accept: "application/json" };
  if (method !== "GET") Object.assign(headers, { "Content-Type": "application/json", "X-Tradvia-CSRF": authState.csrf });
  try {
    const r = await fetch("/api/projects/" + getRepo() + "/connections" + path, {
      method, headers, credentials: "same-origin", body: body === undefined ? undefined : JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    return r.ok ? { ok: true, data: j } : { ok: false, error: j.error || t("connFailed") };
  } catch (e) {
    return { ok: false, error: t("connFailed") };
  }
}

function sourceLabel(role) {
  return role.source === "tradvia.yml" ? t("srcYml") : role.source === "tradvia" ? t("srcTradvia") : t("srcUnset");
}

// Sends one change; on success redraws with the state the server answered.
async function saveConnection(root, method, path, body) {
  root.querySelectorAll(".action-error, .conn-note").forEach((n) => n.remove());
  root.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  const res = await connRequest(method, path, body);
  if (!res.ok) {
    root.querySelectorAll("button").forEach((b) => { b.disabled = false; });
    root.append(el("div", res.error, "msg error action-error"));
    return;
  }
  connState = res.data.connections;
  drawConnections(root);
  if (res.data.github_actions === "ok") root.append(el("div", t("ghActionsOk"), "note conn-note"));
  if (res.data.github_actions === "failed") root.append(el("div", t("ghActionsFailed"), "msg error conn-note"));
}

function roleRow(root, name, role, providers) {
  const row = el("div", null, "role");
  const prov = el("select");
  prov.setAttribute("aria-label", t("role_" + name));
  const model = el("select");
  const fillModels = () => {
    model.replaceChildren();
    const p = providers.find((x) => x.key === prov.value);
    (p ? p.models : []).forEach((m) => model.append(new Option(m, m)));
  };
  prov.append(new Option(t("connChoose"), ""));
  providers.forEach((p) => prov.append(new Option(p.name, p.key)));
  prov.value = role.provider || "";
  fillModels();
  if (role.model) model.value = role.model;
  prov.addEventListener("change", fillModels);
  const save = el("button", t("connSave"));
  save.type = "button";
  save.addEventListener("click", () => {
    if (!prov.value || !model.value) return;
    saveConnection(root, "PUT", "/roles/" + name, { provider: prov.value, model: model.value });
  });
  const origin = sourceLabel(role) + (role.source === "tradvia" && role.updated_by ? " · @" + role.updated_by : "");
  row.append(el("b", t("role_" + name)), prov, model, save, el("span", origin, "sub"));
  return row;
}

function providerCard(root, p) {
  const card = el("div", null, "prov");
  card.append(el("h4", p.name), el("div", t("provKind_" + p.kind) + " · " + p.status, "sub"), el("div", p.note, "sub"));
  if (!p.secret) return card;
  const configured = p.secret.configured;
  card.append(el("div", configured
    ? t("secretAt") + " " + fmtTime(p.secret.set_at) + " " + t("secretBy") + " @" + p.secret.set_by
    : t("secretNone"), configured ? "ok" : "neutral"));
  const input = el("input");
  input.type = "password";
  input.autocomplete = "new-password";
  input.placeholder = t("secretLabel");
  input.setAttribute("aria-label", p.name + " · " + t("secretLabel"));
  const send = el("button", configured ? t("secretReplace") : t("secretSet"));
  send.type = "button";
  send.addEventListener("click", async () => {
    const value = input.value;
    input.value = ""; // never kept in the page
    if (!value.trim()) return;
    await saveConnection(root, "PUT", "/secrets/" + p.key, { value });
  });
  const row = el("div", null, "row");
  row.append(input, send);
  if (configured) {
    const del = el("button", t("secretRemove"));
    del.type = "button";
    del.addEventListener("click", () => saveConnection(root, "DELETE", "/secrets/" + p.key));
    row.append(del);

// "Connect my AI" (ADR 0012): a collaborator creates their own token and gets the MCP setup.
// The token value exists only in agentFresh, right after creation; the server never returns it again.
let agentState = null, agentRepo = null, agentFresh = null;

function copyButton(text) {

function agentSnippets(repo) {
  const url = location.origin;

    TRADVIA_URL: url, TRADVIA_PROJECT: repo, TRADVIA_TOKEN: "${TRADVIA_TOKEN}" } } } }, null, 2);
  const http = url + "/api/projects/" + repo + "/mcp\nAuthorization: Bearer $TRADVIA_TOKEN";

function drawAgentConnect(root) {
  const st = agentState;
  const repo = st.project;
  root.replaceChildren(el("div", t("agentIntro"), "note"));
  const form = el("form", null, "row");
  const role = el("select");
  role.setAttribute("aria-label", t("agentRole"));
  st.roles.filter((r) => r !== "read").forEach((r) => {
    const o = el("option", r); o.value = r; if (r === "triage") o.selected = true; role.append(o);
  });
  const days = el("input");
  Object.assign(days, { type: "number", min: 1, max: st.max_days, value: st.default_days });
  days.setAttribute("aria-label", t("agentDays"));
  const go = el("button", t("agentCreate"));
  go.type = "submit";
  // ADR 0014: an admin can make an AI manager token (role write, extra powers only by grant).
  const kind = el("select");
  kind.setAttribute("aria-label", t("agentKind"));
  [["agent", t("kindAgent")], ["manager", t("kindManager")]].forEach(([v, label]) => {
    const o = el("option", label); o.value = v; kind.append(o);
  });
  kind.addEventListener("change", () => { role.disabled = kind.value === "manager"; if (role.disabled) role.value = "write"; });
  if (st.can_make_manager) form.append(el("span", t("agentKind"), "sub"), kind);
  form.append(el("span", t("agentRole"), "sub"), role, el("span", t("agentDays"), "sub"), days, go);
  const err = el("div", null, "msg error action-error"); err.hidden = true;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; err.hidden = true;
    const res = await panelRequest("POST", "/tokens", { role: role.value, expires_in_days: Number(days.value),
                                                        kind: st.can_make_manager ? kind.value : "agent" });
    go.disabled = false;
    if (!res.ok) { err.textContent = res.error; err.hidden = false; return; }
    agentFresh = res.data.token;
    agentState = null;
    renderAgentConnect();
  });
  root.append(form, el("div", t("agentRoleHelp"), "sub"));
  if (st.can_make_manager) root.append(el("div", t("managerHelp"), "sub"));
  root.append(err);
  if (agentFresh) {
    const box = el("div", null, "secret");
    box.append(el("div", t("agentOnce"), "msg"));
    const row = el("div", null, "row");
    row.append(el("code", agentFresh, "tok"), copyButton(agentFresh));
    box.append(row);
    root.append(box);
  }
  const sn = agentSnippets(repo);
  root.append(el("div", t("agentStdio"), "sub"), el("div", t("agentInstall"), "sub"));
  const copyRow = el("div", null, "row");
  copyRow.append(copyButton(sn.stdio));
  root.append(el("pre", sn.stdio), copyRow);
  root.append(el("div", t("agentHttp"), "sub"));
  root.append(el("pre", sn.http));
  root.append(el("h3", t("agentMine")));
  if (!st.tokens.length) { root.append(el("div", t("agentNone"), "sub")); return; }
  const table = el("table");
  st.tokens.forEach((tk) => {
    const tr = el("tr");
    const when = new Date(tk.expires_at * 1000).toLocaleDateString();
    tr.append(el("td", "#" + tk.id), el("td", tk.kind === "manager" ? t("kindManager") : tk.role),
              el("td", t("agentExpires") + " " + when),
              el("td", tk.active ? t("agentActive") : t("agentInactive")));
    const td = el("td");
    if (tk.active) {
      const b = el("button", t("agentRevoke"));
      b.type = "button";
      b.addEventListener("click", async () => {
        b.disabled = true;
        const res = await panelRequest("DELETE", "/tokens/" + tk.id);
        if (!res.ok) { b.disabled = false; err.textContent = res.error; err.hidden = false; return; }
        agentState = null;
        renderAgentConnect();
      });
      td.append(b);
    }
    tr.append(td);
    table.append(tr);
    if (tk.kind === "manager" && tk.active && st.can_make_manager) table.append(grantRow(tk, err));
  });
  const wrap = el("div", null, "tablewrap");
  wrap.append(table);
  root.append(wrap);
}

// The permissions an admin grants an AI manager beyond its base (ADR 0014), each one with its
// own expiry and revocable at once.
function grantRow(tk, err) {
  const tr = el("tr", null, "grants");
  const td = el("td");
  td.colSpan = 5;
  td.append(el("span", t("managerGrants") + ": ", "sub"));
  const days = el("input");
  Object.assign(days, { type: "number", min: 1, max: agentState.max_days, value: 7 });
  days.setAttribute("aria-label", t("grantDays"));
  td.append(el("span", t("grantFor") + " ", "sub"), days, el("span", " " + t("grantDays") + " · ", "sub"));
  for (const perm of agentState.grantable) {
    const g = (tk.grants || []).find((x) => x.permission === perm && x.active);
    const box = el("span", null, "grant");
    box.append(el("span", t("perm_" + perm) + " "));
    const b = el("button");
    b.type = "button";
    if (g) {
      box.append(el("span", "(" + t("agentExpires") + " " + new Date(g.expires_at * 1000).toLocaleDateString() + ") ", "sub"));
      b.textContent = t("agentRevoke");
      b.addEventListener("click", () => grantAction(b, err, "DELETE", "/tokens/" + tk.id + "/grants/" + g.id));
    } else {
      b.textContent = t("grantGive");
      b.addEventListener("click", () => grantAction(b, err, "POST", "/tokens/" + tk.id + "/grants",
        { permission: perm, expires_in_days: Number(days.value) }));
    }
    box.append(b);
    td.append(box, document.createTextNode(" "));
  }
  tr.append(td);
  return tr;
}

async function grantAction(button, err, method, path, body) {
  button.disabled = true;
  const res = await panelRequest(method, path, body);
  if (!res.ok) { button.disabled = false; err.textContent = res.error; err.hidden = false; return; }
  agentState = null;
  renderAgentConnect();
}

async function renderAgentConnect() {
  const section = document.getElementById("agent-section");
  const me = myRights();
  section.hidden = !(me && me.role && me.role !== "read");
  if (section.hidden) { agentState = null; agentFresh = null; return; }
  const root = document.getElementById("agent-connect");
  if (root.contains(document.activeElement) && agentState && agentRepo === getRepo()) return;
  if (!agentState || agentRepo !== getRepo()) {
    const repo = getRepo();
    if (agentRepo !== repo) agentFresh = null;
    const res = await panelRequest("GET", "/tokens");
    if (!res.ok) { root.replaceChildren(el("div", res.error, "msg error")); return; }
    if (repo !== getRepo()) return;
    agentState = res.data;
    agentRepo = repo;
  }
  drawAgentConnect(root);
}

    el("p", t("settings.yourRole") + ": " + ((mine && mine.role) || t("noRole"))),
    el("p", t("settings.canStart") + ": " + t(mine && mine.can_start ? "settings.yes" : "settings.no")),
    el("p", t("settings.canApprove") + ": " + t(mine && mine.can_approve ? "settings.yes" : "settings.no")),
  );
  roles.append(el("p", t("settings.rolesNote"), "note"));
  if (base) {
    const links = el("p");
    const ex = el("a", t("settings.example"));
    ex.href = base + "/blob/main/docs/tradvia.example.yml";
    const pr = el("a", t("settings.projectsDoc"));
    pr.href = base + "/blob/main/docs/projects.md";
    links.append(ex, document.createTextNode(" · "), pr);
    roles.append(links);
  }
  if (navRights()) root.append(roles);
  else root.append(el("p", t("settings.signInHint"), "sub"));

  // The project's budget (ADR 0018): set here, per project, never in .tradvia.yml.
  if (myRights()) {
    const budget = el("div", null, "settings-section");
    budget.id = "settings-budget";
    budget.append(el("h3", t("budget.title")), el("p", t("loading"), "sub"));
    root.append(budget);
    loadBudgetSettings(budget);
  }

  if (navRights()) {
    const notif = el("div", null, "settings-section");
    const h = el("h3", t("settings.notifications") + " ");
    h.append(el("span", t("soon"), "soon-badge"));
    notif.append(h, el("p", t("settings.notificationsNote"), "sub"));
    root.append(notif);
  }

  const pref = el("div", null, "settings-section");
  pref.append(
    el("h3", t("settings.prefs")),
    settingsSelect(t("settings.language"), prefs.lang, [["pt", "PT-BR"], ["en", "EN"]], (v) => setPref("lang", v)),
    settingsSelect(t("settings.theme"), prefs.theme,
      PREF_THEMES.map((v) => [v, t("theme." + v)]), (v) => setPref("theme", v)),
  );
  root.append(pref);
}

const BUDGET_FIELDS = [
  ["monthly_usd", "budget.monthly", "0.01"], ["max_usd", "budget.maxUsd", "0.01"],
  ["max_minutes", "budget.maxMinutes", "1"], ["max_steps", "budget.maxSteps", "1"],
];

async function loadBudgetSettings(box) {
  const repo = getRepo();
  const res = await panelRequest("GET", "/settings/budget");
  if (repo !== getRepo() || !box.isConnected) return;
  box.replaceChildren(el("h3", t("budget.title")));
  if (!res.ok) { box.append(el("p", res.error, "msg error")); return; }
  drawBudgetSettings(box, res.data);
}

function drawBudgetSettings(box, b) {
  box.append(el("p", t("budget.intro") + " " + b.project, "sub"));
  const m = b.month || {};
  const spent = typeof m.spent_usd === "number" ? "$" + m.spent_usd.toFixed(2) : "—";
  box.append(el("p", t("budget.thisMonth") + ": " + spent +
    (b.monthly_usd ? " / $" + b.monthly_usd + (m.level === "warn" ? " · " + t("budget.warn") :
      m.level === "stop" ? " · " + t("budget.stop") : "") : " · " + t("budget.noCeiling"))));
  if (b.file_budget_ignored) box.append(el("p", t("budget.fileIgnored"), "msg"));
  const form = el("form", null, "budget-form");
  const inputs = {};
  for (const [key, label, step] of BUDGET_FIELDS) {
    const row = el("label", null, "budget-row");
    const input = el("input");
    Object.assign(input, { type: "number", min: step, step, value: b[key] == null ? "" : b[key] });
    if (key === "monthly_usd") input.placeholder = t("budget.noCeiling");
    input.disabled = !b.can_edit;
    inputs[key] = input;
    row.append(el("span", t(label)), input);
    form.append(row);
  }
  const err = el("div", null, "msg error"); err.hidden = true;
  if (b.can_edit) {
    const save = el("button", t("budget.save"));
    save.type = "submit";
    form.append(save);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      save.disabled = true; err.hidden = true;
      const body = {};
      for (const [key] of BUDGET_FIELDS) {
        const v = inputs[key].value.trim();
        body[key] = v === "" ? null : Number(v);
      }
      const res = await panelRequest("PUT", "/settings/budget", body);
      save.disabled = false;
      if (!res.ok) { err.textContent = res.error; err.hidden = false; return; }
      box.replaceChildren(el("h3", t("budget.title")));
      drawBudgetSettings(box, res.data);
      box.append(el("p", t("budget.saved"), "sub"));
    });
  }
  box.append(form, err);
  box.append(el("p", b.can_edit ? t("budget.note") : t("budget.readOnly"), "note"));
  if (b.updated_by) {
    box.append(el("p", t("budget.updated") + " @" + b.updated_by + " · " +
      new Date(b.updated_at * 1000).toLocaleString(), "sub"));
  }
}

function renderHelp() {
  const root = document.getElementById("view-help");
  root.textContent = "";
  root.append(el("h2", t("help.title")));
  const base = safeGithubUrl("https://github.com/" + getRepo());
  if (!base) return;
  const sec = el("div", null, "help-section");
  const ul = el("ul");
  for (const [key, path] of [["help.readme", "/blob/main/README.md"], ["help.kpis", "/blob/main/docs/dashboard-kpis.md"],
    ["help.projects", "/blob/main/docs/projects.md"], ["help.adr", "/tree/main/docs/adr"]]) {
    const a = el("a", t(key));
    a.href = base + path;
    const li = el("li");
    li.append(a);
    ul.append(li);
  }
  sec.append(ul);
  root.append(sec);
}

function renderView() {
  const view = currentView();
  for (const id of VIEWS) document.getElementById("view-" + id).hidden = id !== view;
  renderNav();
  if (view === "settings") renderSettings();
  if (view === "help") renderHelp();
}

function render() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((n) => { n.placeholder = t(n.dataset.i18nPlaceholder); });
  document.getElementById("lang").value = lang;
  renderAuth();
  renderView();
  document.getElementById("meta").textContent =
    getRepo() + (updatedAt ? " · " + t("updated") + " " + updatedAt.toLocaleTimeString() : "") +
    (updatedAt ? " · " + t("dataFrom") + ": " + dataSource : "");
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  document.getElementById("refresh").disabled = fetchState === "loading";
  status.hidden = fetchState === "ok" || currentView() !== "panel";
  status.className = "msg" + (fetchState === "ratelimit" || fetchState === "error" ? " error" : "");
  status.textContent = fetchState === "loading" ? t("loading")
    : fetchState === "ratelimit" ? t("rateLimit") : fetchState === "error" ? t("error") : "";
  content.hidden = fetchState !== "ok" || !data;
  if (!content.hidden) {
    renderRecent();
    // A card filter for a card the board does not hold would empty it: it is ignored, and the panel says so.
    const missing = cardFilterMissing(filters, data.issues);
    const view = applyFilters(data, missing ? { ...filters, card: null } : filters, Date.now());
    renderFilters();
    renderKpis(view);
    renderCharts(view);
    // Card states are derived from every PR and run, not only the filtered ones.
    renderBoard(view.issues, data.prs, data.agentRuns, data.backlog, data.runs);
    showBoardNote(missing ? t("noteFilterCard").replace("{n}", String(filters.card)) : deepLinkNote());
    renderCardDialog(false);
    renderDeploys();
    renderChat();
    loadChat();
    renderRuns(visibleRuns(view.runs, showSkipped));
    openRequestedCard();
    renderConnections();
    renderAgentConnect();
  }
}

let loading = false;
let refreshAgain = false; // a refresh asked for while another was running (e.g. after an action)

// quiet: an automatic reload keeps the current data on screen until the new data arrives,
// and keeps it if the reload fails (the next manual refresh shows the error).
async function refresh(quiet = false) {
  if (loading) { refreshAgain = true; return; }
  loading = true;
  timelineCache.clear();
  if (!quiet) connState = null;
  if (!quiet) {
    recentToken++;
    recentState = { status: "idle", items: [] };
    fetchState = "loading";
    render();
  }
  try {
    selectStore(getRepo());
    const fresh = await loadData(getRepo());
    data = fresh;
    updatedAt = new Date();
    fetchState = "ok";
  } catch (e) {
    if (!quiet || !data) {
      data = null;
      fetchState = e instanceof RateLimitError ? "ratelimit" : "error";
    }
  } finally {
    loading = false;
  }
  render();
  if (authState && authState.authenticated === true) loadAuth(); // keeps the pending counter fresh
  if (fetchState === "ok") {
    if (quiet) recentToken++;
    loadRecent();
  }
  if (refreshAgain) { refreshAgain = false; refresh(true); }
}

// Time of the last edit/focus in a form field. Global because each render replaces the DOM.
let lastEditAt = null;
function noteEdit(e) {
  const x = e.target;
  if (!x || !x.closest || !x.closest("#content")) return;
  if (x.tagName === "TEXTAREA" || x.tagName === "SELECT" ||
      (x.tagName === "INPUT" && x.type !== "checkbox" && x.type !== "button")) lastEditAt = Date.now();
}
document.addEventListener("input", noteEdit);
document.addEventListener("focusin", noteEdit);

function isEditing() {
  const a = document.activeElement;
  const focused = !!a && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" ||
    (a.tagName === "INPUT" && a.type !== "checkbox" && a.type !== "button"));
  const draft = !!document.querySelector(".newcard:not([hidden])") ||
    [...document.querySelectorAll("#content textarea, #content input[type=text]")]
      .some((x) => x.value.trim() !== "");
  return editingActive({ focused, draft, lastEditAt, now: Date.now() });
}

function autoRefreshEnabled() {
  return document.getElementById("auto-refresh").checked;
}

try {
  if (localStorage.getItem("tradvia.autoRefresh") === "off") {
    document.getElementById("auto-refresh").checked = false;
  }
} catch (e) { /* storage unavailable: default on */ }
document.getElementById("auto-refresh").addEventListener("change", (e) => {
  try { localStorage.setItem("tradvia.autoRefresh", e.target.checked ? "on" : "off"); } catch (err) { /* ignore */ }
});

function tickAutoRefresh() {
  const due = autoRefreshDue({
    enabled: autoRefreshEnabled(), hidden: document.hidden || currentView() !== "panel", editing: isEditing(), busy: loading,
    store: !!STORE_API, lastAt: updatedAt ? updatedAt.getTime() : null, now: Date.now(),
  });
  if (due) refresh(true);
}
setInterval(tickAutoRefresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tickAutoRefresh(); });

document.getElementById("refresh").addEventListener("click", () => refresh());
document.getElementById("project").addEventListener("change", (e) => {
  const url = new URL(location.href);
  url.searchParams.set("repo", e.target.value);
  history.replaceState(null, "", url);
  refresh();
});
document.getElementById("lang").addEventListener("change", (e) => {
  setPref("lang", e.target.value);
  // Mirrors the choice under the plain key docs.html (a separate page) reads.
  try { localStorage.setItem("tradvia.lang", e.target.value); } catch (err) { /* ignore */ }
});
window.addEventListener("hashchange", () => { render(); tickAutoRefresh(); scrollToConnectionsIfLinked(); });
document.getElementById("show-skipped").addEventListener("change", (e) => { showSkipped = e.target.checked; runsPage = 0; render(); });
detectApi().then(() => { loadAuth(); return refresh(); }).then(scrollToConnectionsIfLinked);
</script>
