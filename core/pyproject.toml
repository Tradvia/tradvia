# SPDX-License-Identifier: FSL-1.1-ALv2
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tradvia"
version = "0.0.1"
description = "Tradvia core: AI agents as members of a hybrid Kanban board"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
  "langgraph>=1.0",
  "litellm>=1.70",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "starlette>=0.37", "httpx>=0.27", "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
api = ["starlette>=0.37", "uvicorn>=0.30", "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[project.scripts]
tradvia = "tradvia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradvia = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
