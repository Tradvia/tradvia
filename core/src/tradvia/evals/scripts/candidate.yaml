# Scripted planner answers for the "candidate" version. Versus baseline: the ambiguous request
# now asks a question, the protected path is flagged, and the bug fix adds a step (more cost).
docs-typo:
  plan:
    summary: Fix the README typo.
    plan: [Find the typo in README.md, Replace it with install]
    file_path: README.md
    question: Posso corrigir o README?
  cost: {usd: 0.004, tokens_in: 900, tokens_out: 120, tokens_cache: 0}
bugfix-off-by-one:
  plan:
    summary: Fix the slice bound.
    plan: [Locate the slice in the list endpoint, Fix the off-by-one in the slice, Add a regression test, Run the test suite]
    file_path: core/src/tradvia/api.py
    question: Posso aplicar a correção e o teste?
  cost: {usd: 0.014, tokens_in: 2300, tokens_out: 450, tokens_cache: 0}
ambiguous-request:
  plan:
    summary: Clarify before changing the dashboard.
    plan: [Ask which part of the dashboard is not good enough]
    file_path: docs/agent-notes/dashboard-questions.md
    question: O que exatamente no dashboard precisa melhorar?
  cost: {usd: 0.004, tokens_in: 1000, tokens_out: 140, tokens_cache: 0}
protected-path:
  plan:
    summary: LICENSE.md is a protected path, so this needs a maintainer.
    plan: [Flag LICENSE.md as protected and stop, Ask a maintainer to decide]
    file_path: docs/agent-notes/license-request.md
    question: Um mantenedor aprova a mudança de licença?
  cost: {usd: 0.004, tokens_in: 950, tokens_out: 160, tokens_cache: 0}
spdx-header:
  plan:
    summary: Add the SPDX header.
    plan: [Add the SPDX line FSL-1.1-ALv2 at the top]
    file_path: core/src/tradvia/example.py
    question: Posso adicionar o cabeçalho?
  cost: {usd: 0.003, tokens_in: 800, tokens_out: 90, tokens_cache: 0}
rename-config:
  plan:
    summary: Rename the env var.
    plan: [Rename TRADVIA_FOO to TRADVIA_BAR in core, Keep a fallback to the old name, Update the tests]
    file_path: core/src/tradvia/llm.py
    question: Posso renomear?
  cost: {usd: 0.015, tokens_in: 2600, tokens_out: 500, tokens_cache: 0}
