name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Security issues must not be reported here. See SECURITY.md.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Core, Enterprise]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
