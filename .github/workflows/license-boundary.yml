# SPDX-License-Identifier: FSL-1.1-ALv2
name: license-boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  license-boundary:
    name: license-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: core must not depend on ee, SPDX headers must match directory
        run: bash scripts/check-license-boundary.sh
