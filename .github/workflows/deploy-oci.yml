# SPDX-License-Identifier: FSL-1.1-ALv2
# Deploys infra/oci and the dashboard to the OCI host (ADR 0005).
# Runs in the protected "production" environment: a maintainer approves each
# deploy. Secrets live only in that environment.
name: deploy-oci

on:
  push:
    branches: [main]
    paths: ["infra/oci/**", "dashboard/**", "core/**", ".github/workflows/deploy-oci.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH (deploy-only key, pinned host key)
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Secrets pasted from Windows may carry CRLF line endings, which OpenSSH rejects.
          printf '%s\n' "$OCI_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null; then
            echo "::error::OCI_SSH_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -l -f ~/.ssh/deploy | cut -d' ' -f2)"
          printf 'Host oci\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' "$OCI_HOST" > ~/.ssh/config

      - name: Write .env on the host (secrets never stored in the repo)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.TRADVIA_GITHUB_TOKEN }}
          TRADVIA_WEBHOOK_SECRET: ${{ secrets.TRADVIA_WEBHOOK_SECRET }}
          TRADVIA_DOMAIN: ${{ vars.TRADVIA_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          # GITHUB_TOKEN is optional (fine-grained, read-only). Empty means anonymous GitHub API limits.
          # TRADVIA_WEBHOOK_SECRET signs GitHub webhooks (HMAC SHA-256). Empty means webhooks are rejected.
          printf 'TRADVIA_DOMAIN=%s\nACME_EMAIL=%s\nPOSTGRES_PASSWORD=%s\nGITHUB_TOKEN=%s\nTRADVIA_WEBHOOK_SECRET=%s\n' \
            "$TRADVIA_DOMAIN" "$ACME_EMAIL" "$POSTGRES_PASSWORD" "$GITHUB_TOKEN" "$TRADVIA_WEBHOOK_SECRET" \
            | ssh oci 'umask 077 && cat > /opt/tradvia/.env'

      - name: Upload compose, Caddyfile and dashboard
        run: |
          # --inplace keeps the inode: Caddyfile is a single-file bind mount, and a replaced file
          # would stay invisible to the running Caddy container.
          rsync -az --inplace infra/oci/compose.yaml infra/oci/Caddyfile oci:/opt/tradvia/
          rsync -az --delete dashboard/ oci:/opt/tradvia/dashboard/
          # Build context for images built on the host (API service): the package and infra/oci only.
          ssh oci 'mkdir -p /opt/tradvia/src/core /opt/tradvia/src/infra/oci'
          rsync -az --delete --exclude '__pycache__' --exclude '.pytest_cache' --exclude 'tests/' core/ oci:/opt/tradvia/src/core/
          rsync -az --delete infra/oci/ oci:/opt/tradvia/src/infra/oci/

      - name: Start services
        run: ssh oci 'cd /opt/tradvia && docker compose pull -q --ignore-buildable && docker compose up -d --build --remove-orphans && docker compose up -d --no-deps --force-recreate caddy && docker compose ps && docker image prune -f'

      - name: Health check
        env:
          TRADVIA_DOMAIN: ${{ vars.TRADVIA_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://$TRADVIA_DOMAIN/healthz" \
              && curl -fsS "https://$TRADVIA_DOMAIN/api/healthz" | grep -q '"ok":true' && exit 0
            sleep 6
          done
          echo "Health check failed" && exit 1
