# SPDX-License-Identifier: FSL-1.1-ALv2
# Dogfooding: Tradvia works on its own issues.
#
# A maintainer adds the `agent:ready` label to an issue. @Agent-Architect posts a
# plan as a comment and waits for a maintainer to answer "Aprovado" / "Approved",
# "Rejeitado" / "Rejected", or an adjustment. On approval @Agent-Coder opens a PR.
#
# Only people with triage access can add labels, and only OWNER / MEMBER /
# COLLABORATOR replies are read, so outsiders cannot start or approve a run.
# Without the ANTHROPIC_API_KEY secret the run uses the offline planner.
name: agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    name: agent
    if: github.event.label.name == 'agent:ready'
    # GitHub-hosted by default. Set the repository variable TRADVIA_AGENT_RUNS_ON to
    # ["self-hosted","tradvia-oci"] to run on the OCI host (docs/deploy-oci.md);
    # delete it to roll back. Only `issues: labeled` triggers this job, which needs
    # triage access, so outside contributors cannot run code on the self-hosted runner.
    runs-on: ${{ fromJSON(vars.TRADVIA_AGENT_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tradvia talks to GitHub through the API; no git credentials on disk
          # for code the executor runs (make check).
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Node in the tool cache, so `npm install -g` works without root on a self-hosted runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Run the card
        # Repository root: the executor edits files and git reports root-relative paths.
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRADVIA_REPO: ${{ github.repository }}
          TRADVIA_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TRADVIA_CHAT: github
          # Claude Code (subscription) plans and implements when the token exists;
          # otherwise the previous behavior (LiteLLM or offline planner, note executor).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRADVIA_PLANNER: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'claude-code' || '' }}
          TRADVIA_EXECUTOR: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'claude-code' || 'note' }}
          TRADVIA_PLANNER_MODEL: ${{ vars.TRADVIA_PLANNER_MODEL || 'anthropic/claude-sonnet-5-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADVIA_OFFLINE: ${{ secrets.ANTHROPIC_API_KEY == '' && '1' || '0' }}
        run: tradvia --issue ${{ github.event.issue.number }} --wait 3600
