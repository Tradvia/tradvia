# Example .tradvia.yml (ADR 0004). Copy it to the repository root.
# Read from the default branch only. Unknown keys or invalid roles make the
# policy fail closed. Roles: read < triage < write < maintain < admin.
# Nothing can be configured below `read`.
access:
  view: inherit            # inherit | read | triage | write | maintain | admin
interactions:
  start_card: triage       # enforced when TRADVIA_ACTOR is set
  approve_plan: write      # enforced
  mention_assistant: write # parsed, not yet enforced by core
  live_takeover: maintain  # parsed, not yet enforced by core
  budget_control: admin    # parsed, not yet enforced by core
  merge_pr: maintain       # enforced: squash-merge a pull request from the panel
  update_branch: maintain  # enforced: bring a pull request branch up to date with main
  approve_deploy: maintain # enforced: approve/reject/cancel deploys, run the post-deploy operation
  # manage_connections is fixed to admin (ADR 0009); lowering it makes the file invalid.

risk:                      # enforced: risk-based permission gateway (ADR 0006)
  read: free               # free | read | triage | write | maintain | admin
  reversible_write: free   # create branch, commit, open PR, comment
  destructive_external: maintain # merge, delete, publish, deploy, external messages; undeclared actions count as this

# Execution budget per card. Invalid values fall back to these defaults.
# At 80% of any limit the agent gets a system notice; at 100% it stops and the card
# waits for a human.
budget:
  max_minutes: 30          # minutes of agent work
  max_steps: 40            # planner/executor iterations + reported tool calls
  max_usd: 5.0             # estimated cost (API-equivalent)

# Pace of the chat's subscription mode (ADR 0012), when the orchestrator role is claude-code.
# Only ever slower than the ceiling: at least 60 s between answers, at most 20 an hour.
# subscription:
#   min_interval_seconds: 120
#   max_per_hour: 10

# Default provider and model per role (ADR 0009). What an admin sets on the Connections
# screen overrides these, per project. Roles: planner, executor, reviewer, orchestrator.
# Providers: anthropic (claude-fable-5-1, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5),
# gemini (gemini-2.5-pro, gemini-2.5-flash), openai (gpt-5, gpt-5-mini); for the orchestrator
# also claude-code (default), the subscription mode of ADR 0012.
# Secrets never go here: API keys are set on the Connections screen; a subscription token
# stays in its owner's own secrets.
providers:
  planner:
    provider: anthropic
    model: claude-sonnet-5-5
