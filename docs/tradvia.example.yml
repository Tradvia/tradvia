# Example .tradvia.yml (ADR 0004). Copy it to the repository root.
# Read from the default branch only. Unknown keys or invalid roles make the
# policy fail closed. Roles: read < triage < write < maintain < admin.
# Nothing can be configured below `read`.
access:
  view: inherit            # inherit | read | triage | write | maintain | admin
# Roles per action (`interactions`) and the risk policy (`risk`) are NOT set here (ADR 0018).
# They are a setting of the project, made on Tradvia: Settings, Project roles and risk (admin
# only). Sections with those names in this file are ignored, and the panel says so.

# Budgets are NOT set here (ADR 0018). The per-card limits (minutes, steps, US$) and the
# optional monthly ceiling are a setting of the project, made on Tradvia: Settings, Project
# budget (admin by default, the budget_control interaction). A `budget` section in this
# file is ignored, and the panel says so.

# Default provider and model per role (ADR 0019). What an admin sets on the Connections
# screen overrides these, per project. Roles: planner, executor, reviewer, orchestrator.
# Providers: anthropic (claude-fable-5-1, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5),
# gemini (gemini-2.5-pro, gemini-2.5-flash), openai (gpt-5, gpt-5-mini).
# Secrets never go here: they are set on the Connections screen.
providers:
  planner:
    provider: anthropic
    model: claude-sonnet-5-5
